<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HomeSí Prospector</title>
<!--
  La paleta viene PORTADA de commercial-activity, no escrita aca. Ver la
  cabecera de tokens.css: si hay que actualizarla se vuelve a bajar el archivo.
-->
<!--
  Inter para interfaz y Plus Jakarta Sans para títulos. `tokens.css` declara
  --font-body como `var(--font-inter), …` porque allá los inyecta next/font;
  acá se cargan de Google Fonts y homesi.css define esas dos variables, así que
  el contrato del archivo portado se cumple sin editarlo.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="homesi.css">
<!-- La plantilla de la ficha v3, extraída de la maqueta tal cual. Sus clases
     están namespaceadas bajo `.wrap` y no chocan con las de la app. -->
<link rel="stylesheet" href="ficha_v3.css">
<style>
/*
 * Solo el armazon de DOS COLUMNAS, que es propio de esta pantalla. Todo lo
 * demas -- colores, botones, tablas, mensajes-- sale de homesi.css sobre los
 * tokens de marca.
 */
html, body { height: 100% }
.wrap { display: grid; grid-template-columns: 340px 1fr; height: calc(100% - 52px) }
@media (max-width: 860px){ .wrap { grid-template-columns: 1fr } .side { display: none } }
.side { border-right: 1px solid var(--slate-200); display: flex;
  flex-direction: column; min-height: 0; background: var(--white) }
.filtros { padding: 14px; border-bottom: 1px solid var(--slate-200); display: grid; gap: 8px }
.filtros label { margin: 0 }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.cuenta { padding: 9px 14px; font: 600 11px/1.3 var(--font-mono);
  font-variant-numeric: tabular-nums; color: var(--slate-500);
  border-bottom: 1px solid var(--slate-200) }
.listaSide { overflow: auto; flex: 1; min-height: 0 }
.fila { padding: 11px 14px; border-bottom: 1px solid var(--slate-200);
  cursor: pointer; display: flex; gap: 10px; align-items: flex-start }
.fila:hover { background: var(--accent-soft) }
.fila.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--coral) }
.punto { width: 7px; height: 7px; border-radius: var(--radius-full);
  margin-top: 6px; flex: none; background: var(--slate-300) }
.punto.si { background: var(--emerald-700) }
.fila .n { font-weight: 700; font-size: 13px; color: var(--navy) }
.fila .m { color: var(--slate-500); font-size: 11px }
.fila .m b { font-family: var(--font-mono); font-variant-numeric: tabular-nums }
.main { overflow: auto; min-height: 0; padding: 22px 24px 60px }
.main h1 { font: 800 21px/1.2 var(--font-display); color: var(--navy);
  margin: 0 0 3px; letter-spacing: -.02em }
.vacio { color: var(--slate-400); padding: 52px 10px; text-align: center; font-size: 13px }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px }
</style>
</head>
<body>
<header class="hub-header">
  <span class="marca"></span>
  <h1>HomeSí Prospector</h1>
  <span class="sub" id="estadoGlobal">cargando…</span>
  <span class="sub">PACS-H</span>
</header>

<div class="wrap">
  <aside class="side">
    <div class="filtros">
      <input type="search" id="q" placeholder="Buscar por nombre, brokerage o email">
      <div class="frow">
        <select id="fEstado"><option value="">Todos los estados</option></select>
        <select id="fMM">
          <option value="">Con y sin Model Match</option>
          <option value="si">Solo con Model Match</option>
          <option value="no">Solo sin Model Match</option>
        </select>
      </div>
    </div>
    <div class="cuenta" id="cuenta"></div>
    <div class="listaSide" id="lista"></div>
  </aside>
  <main class="main" id="detalle">
    <div class="vacio">Elegí un realtor de la lista para abrir su ficha.</div>
  </main>
</div>

<div class="velo" id="velo"></div>
<aside class="panel" id="panel"></aside>

<!-- El renderer de la ficha v3. Es el MISMO archivo que usa `ficha_v3.html`
     para la aceptación visual: si fueran dos, la aceptación mediría uno y la
     app mostraría el otro. -->
<script src="ficha_v3.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let FILAS = [], SEL = null, TAB = 'mercados', GEO = [], FORZAR = false;
let VENTANA_CONFIRMADA = false;

async function api(ruta, opciones){
  const r = await fetch(ruta, opciones);
  const j = await r.json().catch(() => ({error:'respuesta no-JSON'}));
  if(!r.ok){
    const e = new Error(j.error || ('HTTP ' + r.status));
    e.status = r.status; e.datos = j;
    throw e;
  }
  return j;
}

/* ── lista lateral ────────────────────────────────────────────────────── */
async function cargarLista(){
  const p = new URLSearchParams();
  if($('#q').value.trim()) p.set('q', $('#q').value.trim());
  if($('#fEstado').value) p.set('estado', $('#fEstado').value);
  if($('#fMM').value) p.set('mm', $('#fMM').value);
  $('#cuenta').textContent = 'buscando…';
  try{
    const d = await api('/api/realtors?' + p.toString());
    FILAS = d.filas;
    ESTADOS = d.estados || ESTADOS;
    $('#cuenta').textContent = d.truncado
      ? `${d.mostradas} de ${d.total} · afiná la búsqueda para ver el resto`
      : `${d.mostradas} de ${d.total}`;
    pintarLista();
    llenarEstados();
  }catch(e){
    $('#cuenta').textContent = '';
    $('#lista').innerHTML = `<div class="err" style="margin:12px">${esc(e.message)}</div>`;
  }
}

/* El código de dos letras es el valor; el nombre completo es lo que se ve.
   El mapa viene del servidor: escribirlo también acá sería un segundo sitio
   donde puede divergir, que es justo el bug que se acaba de arreglar. */
let ESTADOS = {};
function llenarEstados(){
  const sel = $('#fEstado');
  if(sel.options.length > 1) return;
  const vistos = [...new Set(FILAS.map(f => f.estado).filter(Boolean))]
    .sort((a,b) => (ESTADOS[a]||a).localeCompare(ESTADOS[b]||b));
  vistos.forEach(e => sel.insertAdjacentHTML('beforeend',
    `<option value="${esc(e)}">${esc(ESTADOS[e] || e)}</option>`));
}

function pintarLista(){
  $('#lista').innerHTML = FILAS.map(f => `
    <div class="fila ${SEL && SEL.id===f.id ? 'sel' : ''}" data-id="${f.id}">
      <span class="punto ${f.sf_lead_id ? 'si' : ''}"
            title="${f.sf_lead_id ? 'con Lead ID' : 'sin llave dura'}"></span>
      <span>
        <div class="n">${esc(f.nombre_completo)}</div>
        <div class="m">${esc(f.brokerage || '—')} · ${esc(f.estado || '—')}
          ${f.unidades_ano != null ? ' · ' + f.unidades_ano + ' u/año' : ''}</div>
        ${f.excluido ? `<span class="badge excluido" style="margin-top:4px">
          <i>⛔</i>${esc(f.excluido)}</span>` : ''}
      </span>
    </div>`).join('') || '<div class="vacio">Nada con esos filtros.</div>';
  document.querySelectorAll('.fila').forEach(el =>
    el.onclick = () => abrir(el.dataset.id));
}

function abrir(id, tab){
  SEL = FILAS.find(f => f.id === id);
  /* Abre por la FICHA, que es el orden que revisaron Isabella y un BD.
     Capturar es una acción; leer es para lo que se abre una ficha. */
  TAB = tab || 'ficha';
  /* El enlace directo: se puede pegar en un mensaje y abre a esta persona.
     Sin esto, «mirá la ficha de Ana» son tres pasos y una búsqueda. */
  try{
    const u = new URL(location.href);
    u.searchParams.set('realtor_id', id);
    u.searchParams.set('tab', TAB);
    history.replaceState(null, '', u);
  }catch(e){ /* en file:// no hay URL que actualizar, y no importa */ }
  pintarLista();
  pintarFicha();
}

/* Abre lo que pida `?realtor_id=…&tab=…` aunque no esté en la lista visible.
   La lista trae 300 de 4.249, así que buscar el id entre los cargados fallaría
   justo para quien no aparece en la primera página -- que es casi todo el
   mundo. */
async function abrirDesdeLaURL(){
  const p = new URLSearchParams(location.search);
  const id = (p.get('realtor_id') || '').trim();
  if(!id) return false;
  if(!FILAS.find(f => f.id === id)){
    try{
      const d = await api('/api/realtors?id=' + encodeURIComponent(id));
      if((d.realtors || []).length) FILAS = FILAS.concat(d.realtors);
    }catch(e){ /* si no se puede, `abrir` deja SEL en null y se ve el vacío */ }
  }
  abrir(id, p.get('tab') || 'ficha');
  return true;
}

/* ── ficha ────────────────────────────────────────────────────────────── */
/* `Model Match` YA no está deshabilitada: no necesita el motor, sólo lee
   `parseado` de la base y lo muestra. Las otras siguen apagadas porque su
   contenido sí se consume del motor de Python. */
/* `Dossier A–G` y `Secuencia 60 días` siguen apagadas, y NO por el motor:
   nadie ha verificado que existan los recursos que el copy promete. Hasta que
   eso pase, cada toque que prometa un recurso va marcado recurso_sin_verificar
   y la secuencia no sale. */
const PESTANAS = [
  /* La ficha v3 va PRIMERO: es el orden que revisaron Isabella y un BD.
     Primero quién es y cómo se le escribe; el motor queda plegado en «Cómo se
     calculó», que es donde vive lo que al BD no le sirve para hablar. */
  ['ficha','Ficha',true],
  ['ficha_datos','Ficha (solo datos)',true],
  ['lectura','Lectura del perfil',true],
  ['calculo','Cómo se calculó',true],
  ['mm','Model Match',true],
  ['mercados','Mercados',true],
  ['ig','Instagram',true],
  ['dossier','Dossier A–G',true],
  ['seq','Secuencia 60 días',true],
];
const PORQUE_APAGADA = {};

function pintarFicha(){
  if(!SEL){ $('#detalle').innerHTML = '<div class="vacio">Elegí un realtor.</div>'; return }
  const tabs = PESTANAS.map(([k,t,activa]) =>
    `<button class="tab" role="tab" aria-selected="${TAB===k}" data-tab="${k}"
      ${activa?'':'disabled'}
      title="${activa?'':esc(PORQUE_APAGADA[k]||'todavía no')}">${t}</button>`
  ).join('');
  $('#detalle').innerHTML = `
    <h1>${esc(SEL.nombre_completo)}</h1>
    <p class="sub">${esc(SEL.brokerage || '—')} ·
      ${esc(ESTADOS[SEL.estado] || SEL.estado || '—')}
      ${SEL.sf_lead_id ? ' · Lead ' + esc(SEL.sf_lead_id) : ' · <b>sin llave dura</b>'}</p>
    <div class="tabs" role="tablist">${tabs}</div>
    <div id="cuerpo"></div>`;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    TAB = b.dataset.tab; pintarFicha();
  });
  if(TAB === 'ficha') vFichaV3();
  if(TAB === 'ficha_datos') vFicha();
  if(TAB === 'mercados') vMercados();
  if(TAB === 'mm') vModelMatch();
  if(TAB === 'lectura' || TAB === 'calculo') vLectura(TAB);
  if(TAB === 'ig') vInstagram();
  if(TAB === 'dossier' || TAB === 'seq') vDossier(TAB);
}

/* ══ DOSSIER Y SECUENCIA ═══════════════════════════════════════════════════
 * Salen sin esperar a que se verifiquen los recursos, porque se quitaron las
 * promesas de material: el valor va DENTRO del mensaje.
 */
async function vDossier(cual){
  $('#cuerpo').innerHTML = '<div class="tarjeta pista">cargando…</div>';
  try{
    const d = await api('/api/dossier?realtor_id=' + encodeURIComponent(SEL.id));
    $('#cuerpo').innerHTML = cual === 'seq' ? vistaSecuencia(d) : vistaDossier(d);
  }catch(e){
    $('#cuerpo').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

function pendientes(d){
  const rs = d.recursos_pendientes || [];
  const sin = rs.filter(r => !r.verificado);
  return `<div class="tarjeta">
    <div class="seccion">Recursos · pendientes de verificar</div>
    <span class="badge ${sin.length ? 'bloqueado' : 'mql'}">
      <i>${sin.length ? '▲' : '✓'}</i>${sin.length} de ${rs.length} sin confirmar</span>
    <p class="sub" style="margin-top:8px">Ninguno se promete en el copy. Cuando
      alguien confirme cuáles existen, vuelven como <b>refuerzo</b>, no como
      promesa.</p>
    <ul class="lista" style="margin-top:10px">${rs.map(r => `
      <li><b>${esc(r.clave)}</b>
        <span class="pista">${esc(r.descripcion)}</span>
        <span class="badge ${r.verificado ? 'mql' : 'sin-evaluar'}"
          style="margin-left:auto"><i>${r.verificado ? '✓' : '·'}</i>${
          r.verificado ? 'verificado' : 'sin verificar'}</span></li>`).join('')}
    </ul></div>`;
}

function vistaDossier(d){
  const c = d.cabecera || {};
  const [cn, ci] = NIVEL_BADGE[c.nivel] || ['sin-evaluar','▣'];

  const bloque = b => {
    /* El bloque F se pinta distinto: es una lista de no/sí, no un dato. */
    if(b.letra === 'F') return `<div class="tarjeta"
      style="border-color:var(--coral)">
      <div class="seccion" style="color:var(--rose-700)">F · ${esc(b.titulo.replace(/^.*·\s*/,''))}</div>
      ${b.datos.map(x => `<div style="border-left:3px solid var(--rose-200);
        padding:8px 0 8px 12px;margin-top:10px">
        <p style="margin:0;font-size:13px;font-weight:700;color:var(--rose-700)">
          ${esc(x.no)}</p>
        <p style="margin:4px 0 0;font-size:13px;color:var(--emerald-800)">
          <b>En su lugar:</b> ${esc(x.si)}</p>
        <p class="pista" style="margin:4px 0 0">${esc(x.por_que)}</p>
      </div>`).join('')}
      <p class="sub" style="margin-top:12px">${esc(b.fuente)}</p></div>`;

    if(b.vacio_porque && !b.texto && !b.datos.length) return `<div class="tarjeta">
      <div class="seccion">${esc(b.letra)} · ${esc(b.titulo)}</div>
      <span class="badge sin-evaluar"><i>▣</i>sin dato</span>
      <p class="sub" style="margin-top:8px">${esc(b.vacio_porque)}</p></div>`;

    return `<div class="tarjeta">
      <div class="seccion">${esc(b.letra)} · ${esc(b.titulo)}</div>
      ${b.texto ? `<p style="margin:8px 0 0;font-size:${b.letra==='E'?'15px':'13px'};
        line-height:1.65;color:var(--${b.letra==='E'?'navy':'slate-800'});
        font-weight:${b.letra==='E'?'700':'500'}">${esc(b.texto)}</p>` : ''}
      ${b.datos.length ? `<ul class="lista" style="margin-top:10px">${
        b.datos.filter(x=>x.v!=null&&x.v!=='').map(x =>
        `<li><b>${esc(x.k)}</b><span class="${typeof x.v==='number'?'num':''}"
          style="margin-left:auto;text-align:right">${esc(x.v)}</span></li>`
      ).join('')}</ul>` : ''}
      ${b.vacio_porque ? `<p class="sub" style="margin-top:8px">${esc(b.vacio_porque)}</p>` : ''}
      ${b.fuente ? `<p class="pista" style="margin-top:8px">${esc(b.fuente)}</p>` : ''}
    </div>`;
  };

  return `
    <div class="banner">
      <div class="seccion">Dossier A–G · ${esc(d.realtor.nombre_mostrado)}</div>
      <span class="badge ${cn}" style="font-size:13px;padding:6px 12px">
        <i>${ci}</i>${esc(c.nivel || '—')}</span>
      <span class="cifra" style="margin-left:12px;font-size:18px">${esc(d.dolor_primario || 'sin evidencia suficiente: no lo sabemos')}</span>
      <span class="pista" style="margin-left:10px">${esc(d.realtor.estado_nombre || '')}
        · ${d.mercados} mercados</span>
    </div>
    ${(d.bloques||[]).map(bloque).join('')}
    ${pendientes(d)}`;
}

function vistaSecuencia(d){
  const s = d.secuencia;
  return `
    <div class="banner">
      <div class="seccion">Secuencia de 60 días</div>
      <span class="cifra ${s.promete_material ? '' : 'bien'}">${s.toques.length} toques</span>
      <span class="pista" style="margin-left:10px">${
        s.promete_material ? 'PROMETE MATERIAL' : 'sin una sola promesa de material'}</span>
    </div>
    ${s.toques.map(t => `
      <div class="tarjeta">
        <div class="seccion">Toque ${t.numero} · día ${t.dia} · ${esc(t.canal)}</div>
        <p style="margin:8px 0;font-size:13px;line-height:1.7;white-space:pre-wrap;color:var(--slate-800)">${esc(t.cuerpo)}</p>
        ${t.fuente_del_valor ? `<p class="sub" style="margin:0">
          <b>Valor:</b> ${esc(t.fuente_del_valor)}</p>` : ''}
      </div>`).join('')}
    ${s.notas.map(n => `<div class="avi">${esc(n)}</div>`).join('')}
    ${pendientes(d)}`;
}

/* ── pestaña Instagram · lo capturado, sin motor ──────────────────────────── */
async function vInstagram(){
  $('#cuerpo').innerHTML = '<div class="tarjeta pista">cargando…</div>';
  try{
    const d = await api('/api/instagram?realtor_id=' + encodeURIComponent(SEL.id));
    if(!d.perfiles.length){
      $('#cuerpo').innerHTML = `<div class="tarjeta">
        <div class="seccion">Instagram</div>
        <span class="badge sin-evaluar"><i>▣</i>sin raspado vigente</span>
        <p class="sub" style="margin-top:8px">Este realtor no tiene señales en
          <code>v_ig_senales_current</code>. Puede que el raspado no lo haya
          alcanzado todavía, o que su lote esté apagado.</p></div>`;
      return;
    }
    $('#cuerpo').innerHTML = d.perfiles.map(p => `
      <div class="tarjeta">
        <div class="seccion">Perfil capturado</div>
        <h2>@${esc(p.handle || '—')}</h2>
        <div style="margin:8px 0">
          <span class="badge ${esc(p.estado_clase)}"><i>◉</i>${esc(p.estado_etiqueta)}</span>
          ${p.handle_confianza ? `<span class="badge sin-evaluar"><i>?</i>handle ${esc(p.handle_confianza)}</span>` : ''}
          ${p.paginacion_truncada ? '<span class="badge bloqueado"><i>▲</i>paginación truncada</span>' : ''}
        </div>
        ${p.estado_evidencia ? `<p class="sub">Evidencia del estado:
          <code>${esc(p.estado_evidencia)}</code></p>` : ''}
        <div class="grid2" style="margin-top:12px">
          <div><span class="pista">publicaciones leídas</span><br>
            <span class="kpi chico">${p.captions_n ?? '—'}</span></div>
          <div><span class="pista">comentarios</span><br>
            <span class="kpi chico">${p.comentarios_n ?? '—'}</span></div>
          <div><span class="pista">capturado</span><br>
            <span class="num">${esc((p.capturado_en||'').slice(0,10))}</span></div>
        </div>
      </div>
      ${p.destacadas.length ? `<div class="tarjeta">
        <div class="seccion">Señales</div>
        <div class="tbl-scroll" style="margin-top:10px">
          <table class="piv"><thead><tr>
            <th class="lbl">Señal</th><th class="totcol">Valor</th>
          </tr></thead><tbody>${p.destacadas.map(s => `
            <tr class="metric"><td class="lbl">${esc(s.etiqueta)}</td>
              <td class="totcol">${esc(s.valor)}</td></tr>`).join('')}
          </tbody></table>
        </div>
        <p class="pista" style="margin-top:8px">El desajuste de idioma es
          comentarios menos publicaciones, sobre piezas clasificables: el 26% de
          los comentarios son sólo emoji y no tienen idioma.</p>
      </div>` : ''}
      <div class="tarjeta">
        <div class="seccion">Todo lo derivado</div>
        <p class="sub">Cada etiqueta lleva el texto que la produjo. Las citas
          van sin autor: nadie se perfila individualmente.</p>
        <ul class="lista" style="margin-top:10px">${
          Object.entries(p.senales).map(([k,v]) =>
            `<li><b>${esc(k)}</b><span class="num" style="margin-left:auto">${esc(String(v).slice(0,140))}</span></li>`
          ).join('')}</ul>
      </div>`).join('');
  }catch(e){
    $('#cuerpo').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

/* ══ LECTURA DEL PERFIL · y CÓMO SE CALCULÓ ════════════════════════════════
 * La misma información a dos profundidades: arriba lo que se lee, abajo de
 * dónde salió. Se piden en una sola llamada para que no puedan discrepar.
 */
const VEREDICTO_BADGE = {
  'es nuestro cliente':            ['mql', '✓'],
  'no es nuestro cliente':         ['excluido', '⛔'],
  'fricción que podemos resolver': ['bloqueado', '▲'],
  'señal de alerta':               ['excluido', '⚠'],
  'neutro':                        ['sin-evaluar', '▣'],
};

/* ── LA FICHA v3 · el orden que revisaron Isabella y un BD ──────────────────
 *
 * Nueve secciones, en este orden: quién es y contacto · veredicto y Salesforce
 * · por qué ella · dolores posibles · mensaje · canal y preguntas · producción
 * · Instagram · mercado y Census.
 *
 * Cuatro reglas, y las cuatro son de contenido y no de diseño:
 *   1 · cada dato con su «De dónde sale»;
 *   2 · lo que no existe se muestra como Pendiente, no se estima;
 *   3 · las hipótesis se escriben como hipótesis, con su marca al lado;
 *   4 · vocabulario de lending en inglés, sin traducir.
 */
function chipPendiente(motivo){
  return `<span class="badge bloqueado"><i>▲</i>Pendiente</span>
    <span class="pista">${esc(motivo || '')}</span>`;
}

/* ── LA FICHA v3, con la plantilla de la maqueta ───────────────────────────
 *
 * Las secciones de código las llena la app; las de IA salen de la ficha que
 * escribió Cowork, y SOLO si pasaron el validador. La cabecera dice cuándo se
 * redactó y con qué versión, y si el paquete cambió desde entonces lo avisa en
 * vez de esconder la ficha: una ficha vieja bien marcada es útil, una ficha
 * vieja sin marcar es una mentira con fecha. */
async function vFichaV3(){
  $('#cuerpo').innerHTML = '<div class="tarjeta pista">cargando la ficha…</div>';
  try{
    const d = await api('/api/ficha_v3?realtor_id=' + encodeURIComponent(SEL.id));
    const r = d.redaccion || {};
    const aviso = r.desactualizada
      ? `<div class="avi">Hay datos nuevos: ficha pendiente de actualizar.
          Se sigue mostrando la del ${esc(String(r.generada_en||'').slice(0,10))}.</div>`
      : '';
    const cabecera = r.generada_en
      ? `<div class="tarjeta" style="margin-bottom:12px">
          <span class="pista">Ficha redactada el
            ${esc(String(r.generada_en).slice(0,10))} ·
            ${esc(r.version_prompt || '')} · por ${esc(r.generada_por || '')}</span>
          <button class="btn sec" id="btnPedir" style="margin-left:12px"
            >Pedir actualización</button></div>`
      : `<div class="tarjeta" style="margin-bottom:12px">
          <span class="pista">Todavía no hay ficha redactada para este realtor.
            Las secciones de datos se muestran igual.</span>
          <button class="btn sec" id="btnPedir" style="margin-left:12px"
            >Pedir que se redacte</button></div>`;
    $('#cuerpo').innerHTML = cabecera + aviso + window.renderFichaV3(d.ficha);
    const bp = $('#btnPedir');
    if(bp) bp.onclick = async () => {
      bp.disabled = true; bp.textContent = 'pidiendo…';
      try{
        await api('/api/pedir_ficha', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({realtor_id: SEL.id})});
        bp.textContent = 'Pedida';
      }catch(e){ bp.textContent = 'no se pudo: ' + e.message; }
    };
    const bc = $('#btnCopiar');
    if(bc) bc.onclick = () => {
      const p = document.querySelector('#msg p');
      navigator.clipboard.writeText(p ? p.innerText.trim() : '')
        .then(() => { bc.textContent = 'Copiado'; }, () => {});
    };
  }catch(e){
    $('#cuerpo').innerHTML = `<div class="tarjeta err">${esc(e.message)}</div>`;
  }
}

};
const barras = n => '█'.repeat(n||0) + '·'.repeat(Math.max(0, 3-(n||0)));

function vistaLectura(d){
  const c = d.cabecera || {};
  const conf = c.confianza || {};
  const [cn, ci] = NIVEL_BADGE[c.nivel] || ['sin-evaluar','▣'];

  /* La exclusión va ARRIBA DE TODO y antes del diagnóstico. Lisa Munoz tiene
     P-Q10, confianza MEDIA y gating: por el diagnóstico sale impecable. Si el
     aviso va abajo, se lee después de haber decidido escribirle. */

      trabaja, no se puede saber si le estaríamos quitando su propia cartera a

  /* Evaluada con un catálogo que ya no existe. Su dolor primario NO se pinta

  const ra = d.reglas_anteriores;
  const aviso_reglas = ra ? `<div class="banner" style="border-color:var(--coral)">
    <div class="seccion" style="color:var(--rose-700)">▲ ${esc(ra.aviso)}</div>

  const ver = d.veredicto || {};
  const aviso_excluido = (ver.estado === 'excluido' || d.excluido)

    ${(ver.evidencia && ver.evidencia.originadores_de_la_casa

          <td>${esc(ver.evidencia.originadores_de_la_casa.join(', '))}</td></tr>
      <tr><td class="lbl">operaciones buyside</td>
          <td class="num">${ver.evidencia.unidades_de_la_casa ?? '—'} de ${
            ver.evidencia.unidades_totales ?? '—'} · ${
            ver.evidencia.share_de_la_casa ?? '—'}% · base ${
            esc(ver.evidencia.base || '')}</td></tr>
    </table>` : ''}
    <p style="margin:8px 0 0;font-size:13px;color:var(--slate-300)">
      El diagnóstico de abajo se calculó igual y se conserva — el raspado y la
      evaluación no estorban. Lo que no existe para esta persona es la
      <b>secuencia</b>: las pestañas Dossier y Secuencia responden 409.</p>
  </div>` : '';

  /* Con más de una captura, decirlo: un diagnóstico que cambió porque alguien
     re-capturó tiene que ser visible, no una sorpresa. */
  const cap = d.capturas || {};
  const aviso_capturas = cap.anteriores > 0 ? `<div class="avi">
    <b>Hay ${cap.lotes} capturas de Model Match de este realtor.</b>
    Manda la más reciente (${esc((cap.vigente_desde||'').slice(0,16).replace('T',' '))});
    ${cap.anteriores === 1 ? 'la anterior queda' : 'las ' + cap.anteriores + ' anteriores quedan'}
    como histórico en la pestaña <b>Model Match</b> y no alimenta el diagnóstico.
    Un perfil describe un momento, y mezclar dos no da un momento mejor.</div>` : '';

  /* 1 · quién es, en prosa. Es lo primero que un BD lee. */
  const quien = aviso_excluido + aviso_reglas + aviso_pendiente
    + aviso_capturas + `<div class="tarjeta">
    <div class="seccion">Qué clase de realtor es</div>
    <p style="margin:6px 0 0;font-size:14px;line-height:1.7;color:var(--slate-800)">
      ${esc(d.narrativa || '')}</p></div>`;

  /* 2 · su nivel y su confianza. */
  const cab = `<div class="banner">
    <div class="seccion">Diagnóstico</div>
    <span class="badge ${cn}" style="font-size:13px;padding:6px 12px">
      <i>${ci}</i>${esc(c.nivel || '—')}</span>
    <!-- NO dice «sin dolor primario». Un realtor sin activaciones no es alguien
         sin dolor: es alguien de quien no sabemos lo suficiente. La diferencia
         es quién queda mal en la frase, y es nuestra la falta de evidencia. -->
    <!-- Con reglas anteriores el dolor viene en su propio campo y se pinta
         MARCADO: ni como vigente, ni escondido. Esconderlo haría que alguien
         lo buscara en la base y lo usara sin el aviso. -->
    <span class="cifra" style="margin-left:12px;font-size:18px">${esc(
      c.dolor_primario
      || (c.dolor_primario_de_reglas_anteriores
          ? c.dolor_primario_de_reglas_anteriores + ' (de reglas anteriores)'
          : 'sin evidencia suficiente: no lo sabemos'))}</span>
    ${c.acto_de_habla ? `<span class="pista" style="margin-left:10px">acto de habla:
      <b style="color:var(--sky)">${esc(c.acto_de_habla)}</b></span>` : ''}
    ${c.gating && c.gating.qualifier ? `<div class="pista" style="margin-top:8px">
      compuerta: ${esc(c.gating.qualifier)} en fuerza
      <span class="num">${c.gating.intensidad ?? '—'}</span>/3</div>` : ''}
  </div>
  <div class="tarjeta">
    <div class="seccion">Confianza del diagnóstico · ${esc(conf.nivel || '—')}</div>
    <p class="sub">No es un porcentaje: es qué términos están y cuáles no.</p>
    <ul class="lista" style="margin-top:10px">${(conf.terminos||[]).map(t => `
      <li><span class="badge ${t.presente ? 'mql' : 'sin-evaluar'}">
        <i>${t.presente ? '✓' : '·'}</i>${esc(t.nombre)}</span>
        <span class="pista">${esc(t.detalle)}</span></li>`).join('')}
    </ul></div>`;

  /* 3 · las hipótesis, con enunciado, fuerza y de dónde salieron. */
  const hip = (d.hipotesis||[]).length ? `<div class="tarjeta">
    <div class="seccion">Hipótesis de dolor</div>
    <p class="sub">El enunciado viene de la matriz PACS-H. Que le aplique a
      esta persona es una hipótesis: la regla que la activó está en cada fila.</p>
    ${d.hipotesis.map(h => `
      <div style="border-left:3px solid ${h.papel==='principal'?'var(--coral)':'var(--slate-200)'};
        padding:10px 0 10px 12px;margin-top:12px">
        <div>
          <b style="color:var(--navy)">${esc(h.qualifier)}</b>
          <span class="badge ${h.papel==='principal'?'excluido':'sin-evaluar'}"
            style="margin-left:6px"><i>◉</i>${esc(h.papel)}</span>
          <span class="num" style="margin-left:6px">${h.intensidad ?? '—'}/3</span>
          <span class="num" style="letter-spacing:2px;color:var(--coral)">${barras(h.intensidad)}</span>
          <span class="badge sin-evaluar" style="margin-left:6px"><i>E</i>${esc(h.grado||'')}</span>
        </div>
        <p style="margin:8px 0 0;font-size:13px;line-height:1.6;color:var(--slate-800)">
          ${esc(h.enunciado || '(este qualifier no está en el banco de la matriz)')}</p>
        <p class="pista" style="margin:6px 0 0">Se activó porque:
          ${esc(h.regla||'—')} <code>${esc(h.regla_id||'')}</code> · ${esc(h.origen||'')}</p>
        ${h.angulo ? `<p style="margin:8px 0 0;font-size:13px">
          <b style="color:var(--navy)">Ángulo:</b> ${esc(h.angulo)}</p>` : ''}
        ${h.municion ? `<p style="margin:4px 0 0;font-size:13px">
          <b style="color:var(--navy)">Munición:</b> ${esc(h.municion)}</p>` : ''}
        ${h.escala ? `<p class="pista" style="margin:6px 0 0">Escala: ${esc(h.escala)}</p>` : ''}
      </div>`).join('')}</div>` : '';

  /* 5 · el contraste, SOLO contra el condado dominante. */
  const contr = (d.lecturas||[]).map(l => {
    const [clase, icono] = VEREDICTO_BADGE[l.bueno_o_malo] || ['sin-evaluar','▣'];
    return `<div class="tarjeta">
      <div class="seccion">${esc(l.titulo)}${l.papel!=='canal'?` · ${esc(l.papel)}`:''}</div>
      <span class="badge ${clase}"><i>${icono}</i>${esc(l.bueno_o_malo)}</span>
      ${l.afirma ? '' : '<span class="badge sin-evaluar"><i>?</i>no afirma: pregunta</span>'}
      ${l.veces ? `<span class="num" style="margin-left:8px;font-size:16px;font-weight:800;color:var(--navy)">${String(l.veces).replace('.',',')}×</span>` : ''}
      <p style="margin:10px 0 0;font-size:13px;line-height:1.6;color:var(--slate-800)">
        ${esc(l.que_dice_del_borrower)}</p>
      <div class="seccion" style="margin-top:12px">Qué hacer</div>
      <p style="margin:0;font-size:13px;line-height:1.6;color:var(--navy);font-weight:600">
        ${esc(l.que_hacer)}</p></div>`;
  }).join('');

  const nota_sec = (d.lecturas_secundarias||[]).length
    ? `<div class="avi">Los otros ${d.lecturas_secundarias.length} contrastes
       — ${esc(d.lecturas_secundarias.map(l=>l.geografia).join(', '))} —
       dicen lo mismo con otro mercado y están en <b>Cómo se calculó</b>.
       En la lectura solo va su condado dominante.</div>`
    : '';

  /* 7 · si podemos originarle. */
  const cov = d.cobertura || {};
  const originar = `<div class="tarjeta">
    <div class="seccion">¿Podemos originarle?</div>
    ${cov.activos == null
      ? `<span class="badge bloqueado"><i>▲</i>no lo sabemos</span>
         <p class="sub" style="margin-top:8px">${esc(cov.razon||'')}</p>`
      : cov.activos === 0
        ? `<span class="badge excluido"><i>⛔</i>no tenemos licencia en
           ${esc(d.realtor.estado_nombre||'')}</span>
           <p class="sub" style="margin-top:8px">Califica comercialmente y hoy
             no podemos originarle. Activarlo sería gastar credibilidad en una
             promesa que no podemos cumplir.</p>`
        : `<span class="badge mql"><i>✓</i>sí</span>
           <span class="kpi chico" style="margin-left:8px">${cov.activos}</span>
           <span class="pista">loan officers con licencia</span>`}
  </div>`;

  return quien + cab + hip + contr + nota_sec + vistaZona(d) + originar +
    (d.sin_dolor ? vistaSinDolor(d) : '');
}

function vistaZona(d){
  if(!d.perfil_de_la_zona) return '';
  return `<div class="tarjeta">
    <div class="seccion">A quién le vende · ${esc(d.perfil_de_la_zona.donde || '')}</div>
    <p style="margin:6px 0 0;font-size:13px;line-height:1.65">
      ${esc(d.perfil_de_la_zona.texto)}</p>
    <p class="sub" style="margin-top:10px">Describe a los compradores de la
      zona, no al realtor.${d.tiene_census ? '' : ' Sin Census del condado todavía.'}</p>
  </div>`;
}

/* Las DOS formas de no tener dolor primario, que no son la misma cosa.
 *
 * Una es no saber nada todavía. La otra es saber que el ángulo hipotecario no
 * le aplica, porque su registro de Model Match dice que vive de listings. Con
 * el mismo encabezado las dos, la segunda se lee como la primera: «no sabemos
 * nada de este señor» sobre alguien del que sabemos bastante. */
const RAMA_COMPUERTA = 'sin apertura hipotecaria';

function tituloSinDolor(sd){
  return sd && sd.rama === RAMA_COMPUERTA
    ? 'Sabemos por dónde NO abrirle'
    : 'El caso más frecuente del lote';
}

function notaApertura(sd){
  return sd && sd.rama === RAMA_COMPUERTA
    ? 'No es la pregunta del lender: a un agente de listings esa pregunta no le toca el negocio. Esta sí, porque la venta que se le cae es suya.'
    : 'Es la pregunta del lender, y va igual en todas: cierra la categoría vacía en el 100% de las filas.';
}

/* El motor guarda un código; la pantalla no lo muestra. */
function aperturaLegible(cod){
  if(!cod) return '—';
  if(cod === 'sin_apertura_hipotecaria') return 'su negocio no pasa por la hipoteca';
  if(cod === 'pregunta_de_cierre_de_brecha_lender') return 'la pregunta del lender';
  return cod;
}

  return `

      <div style="font-size:15px;font-weight:700;line-height:1.45">${esc(d.sin_dolor.titular)}</div>
      <div class="pista" style="margin-top:10px">${esc(d.sin_dolor.cuerpo)}</div>
    </div>
    <div class="tarjeta">
      <div class="seccion">Por dónde abrir</div>
      <h2>${esc(d.sin_dolor.apertura)}</h2>
      <p class="sub">${notaApertura(d.sin_dolor)}</p>
      <div style="margin-top:10px">
        <span class="badge bloqueado"><i>▲</i>cola de ${esc(d.sin_dolor.cola)}</span>
        <span class="badge sin-evaluar"><i>▣</i>rama: ${esc(d.sin_dolor.rama)}</span>
      </div>

/* ══ LA CONFIRMACIÓN ═══════════════════════════════════════════════════════
 * Lo mismo se pinta al guardar y al auditar una captura vieja: si se vieran
 * distinto habría que aprender dos pantallas para leer el mismo dato.
 */
const dinero = v => v == null ? '—'
  : v >= 1e9 ? '$' + (v/1e9).toFixed(1) + 'B'
  : v >= 1e6 ? '$' + (v/1e6).toFixed(1) + 'M'
  : '$' + Math.round(v/1e3) + 'K';
const pct = v => v == null ? '—' : v.toFixed(1).replace('.', ',') + '%';

/* El grano de la operación en la ficha.
 *
 * Cuando la pestaña no está, la tarjeta dice QUÉ FALTA y no un cero. Las
 * compras sin originador identificado son una ausencia, no un dato: con
 * Transactions se ve cuáles fueron cash y cuáles tienen un originador que
 * Model Match no muestra, y restar y llamarlo cash inventa una categoría que
 * nadie midió. */
function tarjetaTransacciones(t, p){
  if(!t){
    const sinOrig = (p && p.buyer_units && p.compras_con_originador
      && p.buyer_units > p.compras_con_originador)
      ? ` · ${p.buyer_units - p.compras_con_originador} de ${p.buyer_units} compras sin originador identificado`
      : '';
    return `<div class="tarjeta">
      <div class="seccion">Operaciones</div>
      <p class="sub" style="margin-top:8px"><b>Falta Transactions</b>${esc(sinOrig)}.
        Sin esa pestaña no se sabe cuáles de sus compras fueron cash y cuáles
        tienen un originador que Model Match no muestra, y eso no se calcula
        por diferencia.</p></div>`;
  }
  const c = t.compras || {}, v = t.ventas || {};
  const mix = Object.entries(t.loan_mix_compra || {})
    .map(([k, n]) => `<li>${esc(k)} · <b>${n}</b></li>`).join('');
  const lend = Object.entries(t.lenders_compra || {})
    .map(([k, n]) => `<li>${esc(k)} · <b>${n}</b></li>`).join('');
  const zips = Object.entries(t.zips_de_compra || {})
    .map(([k, n]) => `${esc(k)} (${n})`).join(' · ');
  const pend = (t.pendientes_de_prestamo || []);
  return `<div class="tarjeta">
    <div class="seccion">Operaciones · una fila por cierre</div>
    <div class="grid2" style="margin-top:12px">
      <div><span class="pista">compras</span><br>
        <span class="kpi chico">${c.total ?? 0}</span></div>
      <div><span class="pista">ventas</span><br>
        <span class="kpi chico">${v.total ?? 0}</span></div>
      <div><span class="pista">compras financiadas</span><br>
        <span class="kpi chico">${c.financiada ?? 0}</span></div>
      <div><span class="pista">cash según Model Match</span><br>
        <span class="kpi chico">${c.cash_segun_mm ?? 0}</span></div>
    </div>
    ${t.completa === false ? `<p class="sub" style="margin-top:10px">
      <b>Faltan páginas</b>: ${esc(t.aviso || '')}</p>` : ''}
    ${t.completa === null ? `<p class="sub" style="margin-top:10px">
      Sin el pie «1 - 25 of 25» no se puede confirmar que estén todas.</p>` : ''}
    ${pend.length ? `<p class="sub" style="margin-top:10px">
      <b>${pend.length}</b> sin datos de préstamo todavía: Model Match los
      recibe entre tres y cinco semanas después del cierre. Volvé a capturar
      Transactions después del ${esc(pend.map(x => x.recapturar_despues_de)
        .filter(Boolean).sort().pop() || 'cierre + 35 días')}.</p>` : ''}
    ${mix ? `<div class="seccion" style="margin-top:14px">Loan mix de compra</div>
      <ul class="lista">${mix}</ul>` : ''}
    ${lend ? `<div class="seccion" style="margin-top:14px">Lenders del lado comprador</div>
      <ul class="lista">${lend}</ul>` : ''}
    ${zips ? `<div class="seccion" style="margin-top:14px">Dónde compra</div>
      <p class="sub">${zips}</p>` : ''}
  </div>`;
}

function pintarResumen(r){
  if(!r) return '';

  /* A QUIÉN quedó pegada, arriba de todo. Es lo único de la confirmación que
     no se puede deducir mirando el resto: los cuatro mercados y el perfil se
     ven igual de bien estando pegados a la persona equivocada. */
  /* `pert` y no `p`: mas abajo esta función ya declara `const p = r.perfil`, y
     dos `const p` en el mismo scope es un SyntaxError que mata el archivo
     entero -- no la función, el archivo. La app quedó en «cargando…» con la
     lista vacía y las comprobaciones por HTTP no lo vieron, porque el HTML se
     sirve igual y la API responde igual: lo único muerto era el navegador. */
  const pert = r.pertenencia;
  const PERT = {
    respalda:  ['mql','✓','El volcado respalda que es suya'],
    discrepa:  ['excluido','⛔','El volcado NO parece de esta persona'],
    no_consta: ['bloqueado','▲','No se pudo comprobar de quién es'],
  };
  const [pc, pi, pt] = pert ? (PERT[pert.veredicto] || PERT.no_consta) : PERT.no_consta;
  const quien = pert ? `<div class="banner" ${pert.veredicto === 'discrepa'
      ? 'style="border-color:var(--salmon)"' : ''}>
    <div class="seccion">Quedó pegada a</div>
    <span class="cifra" style="font-size:18px">${esc(
      (pert.realtor && pert.realtor.nombre_completo) || '—')}</span>
    ${pert.realtor && pert.realtor.brokerage ? `<span class="pista" style="margin-left:10px">
      ${esc(pert.realtor.brokerage)} · ${esc(pert.realtor.estado || '')}</span>` : ''}
    <div style="margin-top:8px">
      <span class="badge ${pc}"><i>${pi}</i>${pt}</span>
      <span class="pista" style="margin-left:8px">${esc(pert.por || '')}</span></div>
    ${pert.veredicto === 'discrepa' ? `<table class="tabla" style="margin-top:10px">
      <tr><td class="lbl">el volcado dice</td>
          <td class="num">${esc(pert.nombre_en_el_volcado || '—')}</td></tr>
      <tr><td class="lbl">la ficha abierta era</td>
          <td class="num">${esc(pert.nombre_en_el_libro || '—')}</td></tr>
      </table>
      <pert class="sub" style="margin-top:8px">Si te equivocaste de ficha, retirá
      el lote y volvé a capturar: el diagnóstico se calcularía con la
      producción de otro.</p>` : ''}
  </div>` : '';

  const secc = r.secciones.map(s => {
    const donde = s.seccion === 'market_signals'
      ? `<span class="badge sin-evaluar"><i>▣</i>${s.nivel === 'estado' ? 'estado' : 'condado'}
         · ${esc(s.etiqueta || '—')}</span>`
      : '';
    return `<li><b>${esc(s.seccion)}</b> ${donde}
      <span class="pista num" style="margin-left:auto">${s.caracteres.toLocaleString('es')} car.</span></li>`;
  }).join('');

  const geo = r.geografias.map(g => `
    <tr class="metric ${g.volumen_repetido ? 'repetido' : ''}">
      <td class="lbl">${esc(g.etiqueta || '(estado)')}</td>
      <td>${esc(g.nivel || '—')}</td>
      <td>${dinero(g.total_volume)}</td>
      <td>${pct(g.mkt_fha)}</td>
      <td>${pct(g.fallout)}</td>
      <td class="totcol">${g.campos == null ? '—' : g.campos}</td>
    </tr>`).join('');

  const repes = (r.volumenes_repetidos || []).length
    ? `<div class="err"><b>Dos geografías con el mismo volumen:</b>
        ${r.volumenes_repetidos.map(n => esc(n.join(' y '))).join('; ')}.
        Eso es el Rolling Monthly Performance, que no respeta el filtro de
        ubicación. Hay que copiar la sección <b>Market Overview</b>.</div>`
    : '';

  const orig = r.originadores.length ? r.originadores.map(o => `
      <li><b>${esc(o.nombre || '—')}</b>
        <span class="pista">${esc(o.empresa || '—')}</span>
        ${o.de_la_casa
          ? '<span class="badge excluido"><i>⛔</i>de la casa</span>' : ''}
        <span class="num" style="margin-left:auto">${o.unidades ?? '—'} u · ${pct(o.share)}</span></li>`).join('')
    : '<li class="pista">sin relaciones de originador en esta captura</li>';

  /* Banner oscuro: la cifra que decide la exclusión, en Soft Sky y mono. */
  const casa = r.share_de_la_casa || {};
  const banner = casa.share != null
    ? `<div class="banner">
         <div class="seccion">Exclusión por no-canibalización · base ${esc(casa.base || '')}</div>
         <span class="cifra ${casa.share > 0 ? '' : 'bien'}">${pct(casa.share)}</span>
         <span class="pista num" style="margin-left:10px">${casa.unidades} de
           ${casa.unidades_totales} unidades del reparto</span>
         ${(casa.originadores||[]).length
           ? '<div class="pista" style="margin-top:6px">' +
             esc(casa.originadores.join(' · ')) + '</div>' : ''}
       </div>`
    : `<div class="banner">
         <div class="seccion">Exclusión por no-canibalización</div>
         <span class="badge bloqueado"><i>▲</i>no se pudo calcular</span>
         <div class="pista" style="margin-top:8px">${esc(casa.razon || '')}</div>
       </div>`;

  const fallos = (r.fallos || []).length
    ? `<div class="tarjeta">
        <div class="seccion">Fallos de lectura</div>
        <p class="sub">Secciones que venían en el texto y quedaron vacías. El
          crudo está guardado: se arregla el parser y se re-deriva sin volver a
          capturar.</p>
        ${r.fallos.map(f => `<div class="avi"><b>${esc(f.seccion)}</b> →
          <code>${esc(f.campo)}</code><br>${esc(f.por_que_importa || '')}</div>`).join('')}</div>`
    : `<div class="tarjeta">
        <div class="seccion">Fallos de lectura</div>
        <span class="badge mql"><i>✓</i>ninguno</span>
        <span class="sub" style="margin-left:8px">Todas las secciones presentes
          en el texto llegaron a un campo.</span></div>`;

  const p = r.perfil || {};
  const guardia = p.cobertura_mix != null && p.cobertura_mix < 50;
  return `
    ${quien}
    ${banner}
    ${repes}
    <div class="tarjeta">
      <div class="seccion">Bloques separados</div>
      <h2>${r.secciones.length} secciones, en orden de captura</h2>
      <ul class="lista" style="margin-top:10px">${secc}</ul>
    </div>
    <div class="tarjeta">
      <div class="seccion">Por geografía</div>
      <h2>Volumen, FHA del mercado y fallout</h2>
      <p class="sub" style="margin-bottom:10px">Si dos filas repiten volumen,
        salen en rojo: es la firma del gráfico rodante.</p>
      <div class="tbl-scroll">
        <table class="piv">
          <thead><tr>
            <th class="lbl">Geografía</th><th>Nivel</th><th>Volumen</th>
            <th>FHA</th><th>Fallout</th><th class="totcol">Campos</th>
          </tr></thead>
          <tbody>${geo || '<tr class="metric"><td class="lbl">—</td></tr>'}</tbody>
        </table>
      </div>
    </div>
    <div class="tarjeta">
      <div class="seccion">Originadores · reparto por unidades</div>
      <ul class="lista" style="margin-top:10px">${orig}</ul>
    </div>
    ${tarjetaTransacciones(r.transacciones, p)}
    <div class="tarjeta">
      <div class="seccion">Perfil</div>
      <div class="grid2" style="margin-top:12px">
        <div><span class="pista">nombre</span><br>
          <b style="color:var(--navy)">${esc(p.nombre || '—')}</b></div>
        <div><span class="pista">buyer units</span><br>
          <span class="kpi chico">${p.buyer_units ?? '—'}</span></div>
        <div><span class="pista">TPO del agente</span><br>
          <span class="kpi chico">${pct(p.tpo_pct)}</span></div>
        <div><span class="pista">lenders</span><br>
          <span class="kpi chico">${p.lenders ?? 0}</span></div>
        <div><span class="pista">cobertura del mix</span><br>
          <span class="kpi chico">${pct(p.cobertura_mix)}</span>
          ${guardia ? '<br><span class="badge bloqueado"><i>▲</i>no pasa la guardia</span>' : ''}</div>
      </div>
    </div>
    ${fallos}`;
}

/* ── panel lateral · el crudo tal como se pegó ────────────────────────────── */

/* ── pestaña Model Match · lo capturado, desde la base ────────────────────── */
async function vModelMatch(){
  $('#cuerpo').innerHTML = '<div class="tarjeta pista">cargando capturas…</div>';
  try{

      reciente. Las demás quedan como histórico y no alimentan el
      diagnóstico.</div>` : '') + d.capturas.map((c, i) => `
      <div class="tarjeta">
        <div class="seccion">Captura ${d.capturas.length - i} de ${d.capturas.length}</div>
        <span class="badge ${i === 0 ? 'mql' : 'sin-evaluar'}">
          <i>${i === 0 ? '✓' : '·'}</i>${i === 0 ? 'manda' : 'histórico'}</span>
        <h2>${esc((c.capturado_en || '').slice(0,16).replace('T',' '))} ·
          ${esc(c.estado || '—')}</h2>
        <p class="sub" style="margin-bottom:10px">
          <span class="num">${c.caracteres.toLocaleString('es')}</span> caracteres ·
          <code>${esc(c.version_parser || '')}</code></p>
        <div>${(c.bloques||[]).map((b,j) => `
          <button class="btn sec" style="margin:0 6px 6px 0;padding:6px 11px"
            data-cap="${i}" data-blo="${j}">

/* ── pestaña Mercados · el pegado va acá, dentro de la ficha ──────────── */
/* ══ CAPTURA POR CAJAS ═════════════════════════════════════════════════════
 * Una caja por sección, cada una con su nombre. El condado lo define LA CAJA,
 * no la posición: antes se pegaba todo junto y el servidor exigía 1 + N
 * bloques exactos, así que cuando Model Match mostraba 5 condados en el
 * Overview y 3 en Market Insight, la captura se rechazaba entera.
 */
let CAJAS = [];          /* [{clave, tipo, etiqueta, vacio_declarado}] */
let CONDADOS = [];       /* lo que devolvió /api/leer_overview, editable */

function vMercados(){

    <div id="cajas"></div>

      <span class="pista" id="tam"></span>
    </div>
    <div id="confirmacion"></div>
    <div class="tarjeta">
      <h2>Biblioteca de geografías</h2>
      <div id="biblio" class="pista">cargando…</div>
    </div>`;
  if(!SEL.sf_lead_id) $('#extra').innerHTML =
    `<label>MMI Agent ID <span class="pista">este realtor no tiene Lead ID,
      así que hace falta</span></label><input type="text" id="agent">`;
  $('#ovw').oninput = () => {
    const n = $('#ovw').value.length;
    $('#tamOvw').textContent = n ? n.toLocaleString('es') + ' caracteres' : '';
  };
  $('#btnLeer').onclick = leerOverview;
  /* Un 14 declarado y un 14 por descuido son el mismo número y no valen lo
     mismo. Tocar el campo — aunque se deje en 14 — cuenta como mirarlo. */
  VENTANA_CONFIRMADA = false;
  $('#ventana').oninput = $('#ventana').onfocus = () => {
    VENTANA_CONFIRMADA = true;
    $('#ventanaOrigen').className = 'badge mql';

/* Una línea por caja, con uno de los tres estados. Es lo que se mira antes de
   pasar al realtor siguiente: «leído (N métricas)», «vacío declarado» o «no se
   pudo leer». Sin esto hay que abrir la base para saber qué entró. */
const ESTADO_CAJA = {
  leido:           ['mql','✓','leído'],
  vacio_declarado: ['sin-evaluar','·','vacío declarado'],
  sin_pegar:       ['bloqueado','▲','falta capturar'],
  no_se_pudo_leer: ['excluido','⛔','no se pudo leer (se guardó el texto)'],
};

function pintarCajasGuardadas(d){
  const c = d.cajas;
  if(!c) return '';
  const filas = (c.cajas || []).map(x => {
    const [cl, ic, tx] = ESTADO_CAJA[x.estado] || ESTADO_CAJA.sin_pegar;
    return `<tr class="metric">
      <td class="lbl">${esc(x.etiqueta || x.clave)}</td>
      <td><span class="badge ${cl}"><i>${ic}</i>${tx}</span></td>
      <td class="num">${x.caracteres ? x.caracteres.toLocaleString('es') + ' car.' : '—'}</td>
      <td class="pista">${esc(x.aviso || '')}</td></tr>`;
  }).join('');
  const faltan = c.faltan || [];
  const sinMI = d.sin_market_insight || [];
  return `<div class="tarjeta">
    <div class="seccion">Qué entró, caja por caja</div>
    <table class="tabla" style="margin-top:8px"><tbody>${filas}</tbody></table>
    ${sinMI.length ? `<p class="sub" style="margin-top:10px">Model Match no
      muestra Market Insight de <b>${esc(sinMI.join(', '))}</b>: se guardaron
      como «no disponible» y no bloquean nada.</p>` : ''}
    ${faltan.length ? `<div class="avi" style="margin-top:10px">Quedaron sin
      pegar y sin marcar: <b>${esc(faltan.join(', '))}</b>. Si Model Match no
      las muestra, marcá su casilla; si no, pegalas y volvé a guardar.</div>` : ''}
  </div>`;
}

/* ── paso 1 · leer el Overview ─────────────────────────────────────────── */
async function leerOverview(){
  const texto = $('#ovw').value;
  if(!texto.trim()){
    $('#msgs').innerHTML = `<div class="err">La caja del Overview está vacía.</div>`;
    return;
  }
  $('#btnLeer').disabled = true; $('#btnLeer').textContent = 'leyendo…';
  try{
    const d = await api('/api/leer_overview', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({overview: texto})
    });
    CONDADOS = (d.condados || []).map(c => c.nombre);
    $('#msgs').innerHTML = d.aviso ? `<div class="avi">${esc(d.aviso)}</div>` : '';
    pintarDetectado(d);
    ACTUALIZAR = {};
    await cargarBiblioteca(d.estado || SEL.estado || '');
    pintarCajas(d);
    $('#tarjetaGuardar').style.display = '';
  }catch(e){
    $('#msgs').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }finally{
    $('#btnLeer').disabled = false; $('#btnLeer').textContent = 'Leer';
  }
}

function pintarDetectado(d){
  $('#detectado').innerHTML = `
    <div class="tarjeta" style="margin-top:12px">
      <div class="seccion">Lo que detecté</div>
      ${d.nombre ? `<p class="sub" style="margin:4px 0">Agente:
        <b>${esc(d.nombre)}</b>${d.buyer_units != null
          ? ` · <span class="num">${d.buyer_units}</span> buyer units` : ''}</p>` : ''}
      <label style="margin-top:8px">Estado
        <span class="pista">corregilo si no es el que va</span></label>
      <input type="text" id="estadoDet" value="${esc(d.estado || SEL.estado || '')}"
        style="max-width:120px">
      <label style="margin-top:12px">Condados
        <span class="pista">uno por línea. Quitá los que no van o agregá los
          que falten: cada uno tendrá su caja.</span></label>
      <textarea id="condadosDet" style="min-height:90px">${
        esc(CONDADOS.join('\n'))}</textarea>
      <button class="btn" id="btnRehacer" style="margin-top:8px">
        Rehacer las cajas con estos condados</button>
    </div>`;
  $('#btnRehacer').onclick = async () => {
    CONDADOS = $('#condadosDet').value.split('\n')
      .map(s => s.trim()).filter(Boolean);
    ACTUALIZAR = {};
    await cargarBiblioteca($('#estadoDet').value);
    pintarCajas({estado: $('#estadoDet').value});
  };

/* Lo que la biblioteca ya tiene, por geografía. Clave: etiqueta en minúsculas.
 *
 * Un benchmark de condado no es del realtor: es del condado. Pedir Cook por
 * cuarta vez en un día es pedir cuatro veces el mismo dato, y cada pegado es
 * una oportunidad de ponerlo en la caja equivocada. */
let BIBLIOTECA = {};
/* Las que el usuario decidió pegar igual, para actualizarlas. */
let ACTUALIZAR = {};

async function cargarBiblioteca(estado){
  BIBLIOTECA = {};
  if(!estado) return;
  try{
    const d = await api('/api/mercados_en_biblioteca?estado='
      + encodeURIComponent(estado) + '&condados='
      + encodeURIComponent(CONDADOS.join('|')));
    (d.geografias || []).forEach(g => {
      BIBLIOTECA[(g.etiqueta || '').trim().toLowerCase()] = g;
    });
  }catch(e){
    /* Que la biblioteca no responda NO puede impedir capturar: las cajas
       vuelven a pedir el pegado, que es como funcionaba antes. */
    BIBLIOTECA = {};
  }
}

function deLaBiblioteca(etiqueta){
  return BIBLIOTECA[(etiqueta || '').trim().toLowerCase()] || null;
}

function fechaCorta(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? String(iso).slice(0,10)
    : d.toLocaleDateString('es', {day:'numeric', month:'short', year:'numeric'});
}

/* ── paso 2 · una caja por geografía, más Originators y Lenders ────────── */
function pintarCajas(d){
  const estado = ($('#estadoDet') ? $('#estadoDet').value : d.estado) || '';
  CAJAS = [{clave:'ms_estado', tipo:'estado', etiqueta: estado}]
    .concat(CONDADOS.map((c,i) => ({clave:'ms_'+i, tipo:'condado', etiqueta:c})))
    .concat([{clave:'orig', tipo:'originators', etiqueta:'Originators (Buyer)'},
             {clave:'lend', tipo:'lenders', etiqueta:'Lenders'},
             {clave:'trx', tipo:'transacciones', etiqueta:'Transactions'}]);

  $('#cajas').innerHTML = CAJAS.map(c => {
    const esGeo = c.tipo === 'estado' || c.tipo === 'condado';
    const titulo = esGeo
      ? `Market Insight · ${c.tipo === 'estado' ? 'estado de ' : ''}${esc(c.etiqueta || '—')}`
      : esc(c.etiqueta);
    /* La casilla solo en Originators y Lenders: son las dos secciones donde
       «no hay» y «no miré» son cosas distintas y el veredicto las trata
       distinto. En una geografía, vacío es vacío. */
    const QUE = {originators: 'originadores', lenders: 'lenders',
                 transacciones: 'operaciones'};
    const casilla = esGeo ? '' : `
      <label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:400">
        <input type="checkbox" id="vd_${c.clave}" style="width:auto;margin:0">
        <span>Model Match no muestra ${QUE[c.tipo] || 'esta sección'} para este agente</span></label>`;
    /* Transactions es la única con una instrucción propia, porque es la única
       donde pegar de menos se ve igual que pegar entero: 25 filas de 137 dan
       un loan mix con la misma cara que el de verdad. El pie es lo que lo
       delata, así que hay que pedirlo. */
    const nota = esGeo ? `<span class="pista">puede quedar vacía: se guarda
      como «Model Match no muestra este condado»</span>`
      : (c.tipo === 'transacciones' ? `<span class="pista">pegá la tabla
        ENTERA, con el pie que dice «1 - 25 of 25». Sin ese pie no se puede
        saber si faltan páginas, y con páginas de menos no se calcula nada.
        Los nombres de compradores y vendedores no se guardan.</span>` : '');

    /* Lo que ya está en la biblioteca no se vuelve a pedir. */
    const bib = esGeo ? deLaBiblioteca(c.etiqueta) : null;
    const yaEsta = bib && bib.estado_biblioteca === 'fresco'
      && !ACTUALIZAR[c.clave];
    const vieja = bib && bib.estado_biblioteca === 'viejo'
      && !ACTUALIZAR[c.clave];

    if(yaEsta) return `<div class="tarjeta">
      <div class="seccion">${titulo}</div>
      <p class="sub" style="margin:6px 0"><b>Ya en la biblioteca</b> ·
        capturado el ${esc(fechaCorta(bib.capturado_en))}${bib.con_quien
          ? ' al capturar a ' + esc(bib.con_quien) : ''} ·
        <span class="num">${esc(String(bib.campos ?? '?'))}</span> métricas.
        No hace falta pegarlo: este realtor queda enlazado a esa fila.</p>
      <button class="btn sec" id="act_${c.clave}">Actualizar: pegar uno nuevo</button>
    </div>`;

    if(vieja) return `<div class="tarjeta">
      <div class="seccion">${titulo}</div>
      <p class="sub" style="margin:6px 0">Hay una del
        ${esc(fechaCorta(bib.capturado_en))} (hace
        <span class="num">${bib.dias}</span> días,
        <span class="num">${esc(String(bib.campos ?? '?'))}</span> métricas):
        ¿usar esa o pegar una nueva?</p>
      <button class="btn sec" id="usar_${c.clave}">Usar la del
        ${esc(fechaCorta(bib.capturado_en))}</button>
      <button class="btn sec" id="act_${c.clave}"
        style="margin-left:8px">Pegar una nueva</button>
    </div>`;

    return `<div class="tarjeta">
      <div class="seccion">${titulo}</div>
      ${nota}
      <textarea id="tx_${c.clave}" style="min-height:110px"
        placeholder="Pegá acá esta sección, o dejala vacía."></textarea>
      ${casilla}
    </div>`;
  }).join('');

  /* Los botones, después de pintar. `USAR` marca la caja como resuelta desde
     la biblioteca; `ACTUALIZAR` la devuelve a pedir el pegado. */
  CAJAS.forEach(c => {
    const act = $('#act_' + c.clave);
    if(act) act.onclick = () => { ACTUALIZAR[c.clave] = true; pintarCajas(d); };
    const usar = $('#usar_' + c.clave);
    if(usar) usar.onclick = () => {
      const b = deLaBiblioteca(c.etiqueta);
      if(b) b.estado_biblioteca = 'fresco';   /* se trata como resuelta */
      pintarCajas(d);
    };
  });
}

/* Las geografías que NO se pegan porque salen de la biblioteca. Es lo que
   viaja al guardado, y lo que deja al realtor enlazado a esa fila. */
function mercadosEnlazados(){
  return CAJAS
    .filter(c => (c.tipo === 'estado' || c.tipo === 'condado')
                 && !ACTUALIZAR[c.clave])
    .map(c => deLaBiblioteca(c.etiqueta))
    .filter(b => b && b.estado_biblioteca === 'fresco' && b.mercado_id);
}

/* Lo que Transactions aporta, en la confirmación del guardado.
 *
 * «Cash» NO se escribe como «pagó en efectivo»: Model Match dice que considera
 * cash una operación hasta que recibe los datos del préstamo, y eso tarda de
 * tres a cinco semanas. Por eso las de menos de 35 días salen en su propia
 * línea, con la fecha a partir de la cual vale la pena volver a capturar. */
function resumenTx(t){
  if(!t || !t.resumen) return '';
  const r = t.resumen, c = r.compras || {};
  const pend = (r.pendientes_de_prestamo || []);
  const completa = t.completa === false
    ? ' <b>faltan páginas</b>' : (t.completa === null ? ' (sin pie: no se puede confirmar que estén todas)' : '');
  const mix = Object.entries(r.loan_mix_compra || {})
    .map(([k, v]) => esc(k) + ' ' + v).join(' · ');
  const linPend = pend.length ? `<br><b>${pend.length}</b> ${pend.length === 1
    ? 'operación todavía sin datos de préstamo en Model Match' :
    'operaciones todavía sin datos de préstamo en Model Match'}: volvé a
    capturar Transactions después del ${esc(pend.map(p =>
      p.recapturar_despues_de).filter(Boolean).sort().pop() || 'cierre + 35 días')}` : '';
  return `<br>Transactions: <span class="num">${t.leidas}</span> operaciones
    leídas${completa} · <span class="num">${c.financiada ?? 0}</span> compras
    financiadas y <span class="num">${c.cash_segun_mm ?? 0}</span> cash según
    Model Match${mix ? '<br>loan mix: ' + mix : ''}${linPend}`;
}

/* ── paso 3 · guardar ──────────────────────────────────────────────────── */
async function guardar(){
  const overview = $('#ovw') ? $('#ovw').value : '';
  if(!overview.trim()){
    $('#msgs').innerHTML = `<div class="err">La caja del Overview está vacía.</div>`;
    return;
  }
  const cajas = CAJAS.map(c => ({
    clave: c.clave, tipo: c.tipo, etiqueta: c.etiqueta,
    texto: ($('#tx_'+c.clave) ? $('#tx_'+c.clave).value : ''),
    vacio_declarado: !!($('#vd_'+c.clave) && $('#vd_'+c.clave).checked),
  }));
  const enlazados = mercadosEnlazados();
  $('#btnGuardar').disabled = true;
  $('#btnGuardar').textContent = 'guardando…';
  try{
    const d = await api('/api/guardar', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        realtor_id: SEL.id, sf_lead_id: SEL.sf_lead_id,
        estado: ($('#estadoDet') ? $('#estadoDet').value : SEL.estado),
        mmi_agent_id: ($('#agent') ? $('#agent').value : ''),
        overview: overview, cajas: cajas, forzar: FORZAR,
        mercados_enlazados: enlazados,
        ventana_meses: ($('#ventana') ? $('#ventana').value : null),
        ventana_confirmada: VENTANA_CONFIRMADA,
      })
    });
    const avisos = (d.avisos||[]).map(a => `<div class="avi">${esc(a)}</div>`).join('');
    const cond = (d.condados||[]).join(' · ');
    const cont = (d.contactos||[]).map(c =>
      c.canal + ': ' + c.valor + (c.nuevo ? '' : ' (ya estaba)')).join(' · ');
    const tx = d.transacciones ? resumenTx(d.transacciones) : '';
    $('#msgs').innerHTML = `<div class="ok">
      <b><span class="num">${d.bloques}</span> bloques guardados</b> ·
      <span class="num">${d.mercados_promovidos ?? 0}</span> promovidos a la
      biblioteca · ${esc(d.estado || '')} ·
      lote <code>${esc(d.upload_batch_id)}</code>
      ${cond ? '<br>condados: ' + esc(cond) : ''}
      ${cont ? `<br>contactos: <span class="num">${d.contactos_nuevos ?? 0}</span>
        nuevos, <span class="num">${d.contactos_ya_estaban ?? 0}</span> ya estaban
        · ${esc(cont)}` : ''}
      ${tx}</div>${avisos}`;
    /* La confirmación va DEBAJO de la caja y no se borra: es lo que se mira
       antes de pasar al realtor siguiente. */
    $('#confirmacion').innerHTML = pintarCajasGuardadas(d)
      + pintarResumen(d.resumen);
    /* NO se borran las cajas: la confirmación se lee al lado de lo que se
       pegó, y si algo salió mal hay que poder mirar qué había. */
    cargarBiblio();
  }catch(e){
    /* 409 = este volcado ya esta, identico. Se puede guardar igual, pero a
       proposito: cada copia infla el conteo de capturas por mercado. */
    const repetido = e.status === 409;
    $('#msgs').innerHTML = `<div class="err">${esc(e.message)}</div>` +
      (repetido ? `<div style="margin:8px 0">
        <button class="btn sec" id="btnIgual">Guardarlo igual</button></div>` : '');
    if(repetido) $('#btnIgual').onclick = () => { FORZAR = true; guardar() };
  }finally{
    FORZAR = false;
    if($('#btnGuardar')){ $('#btnGuardar').disabled=false; $('#btnGuardar').textContent='Guardar' }
    window.scrollTo({top:0, behavior:'smooth'});
  }
}

async function cargarBiblio(){
  try{
    const d = await api('/api/geografias');
    GEO = d.geografias;
    $('#biblio').innerHTML = GEO.length
      ? `<div class="tbl-scroll"><table class="piv"><thead><tr>
          <th class="lbl">Geografía</th><th>Nivel</th><th>Realtors</th>
          <th class="totcol">Capturas</th></tr></thead><tbody>` +
        GEO.map(g => `<tr class="metric"><td class="lbl">${esc(g.clave)}</td>
          <td><span class="badge sin-evaluar">${esc(g.nivel)}</span></td>
          <td>${g.realtors}</td>
          <td class="totcol">${g.capturas}</td></tr>`).join('') +
        '</tbody></table></div>'
      : '<span class="badge sin-evaluar"><i>▣</i>Todavía no hay ninguna geografía capturada</span>';
  }catch(e){ $('#biblio').innerHTML = `<div class="avi">${esc(e.message)}</div>` }
}

/* ── arranque ─────────────────────────────────────────────────────────── */
$('#velo').onclick = cerrarPanel;
document.addEventListener('keydown', e => { if(e.key === 'Escape') cerrarPanel() });
let t = null;
$('#q').oninput = () => { clearTimeout(t); t = setTimeout(cargarLista, 280) };
$('#fEstado').onchange = cargarLista;
$('#fMM').onchange = cargarLista;
cargarLista()
  .then(() => { $('#estadoGlobal').textContent = ''; return abrirDesdeLaURL(); });
</script>
