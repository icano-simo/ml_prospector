<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HomeSí Prospector</title>
<!--
  La paleta viene PORTADA de commercial-activity, no escrita aca. Ver la
  cabecera de tokens.css: si hay que actualizarla se vuelve a bajar el archivo.
-->
<!--
  Inter para interfaz y Plus Jakarta Sans para títulos. `tokens.css` declara
  --font-body como `var(--font-inter), …` porque allá los inyecta next/font;
  acá se cargan de Google Fonts y homesi.css define esas dos variables, así que
  el contrato del archivo portado se cumple sin editarlo.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="homesi.css">
<style>
/*
 * Solo el armazon de DOS COLUMNAS, que es propio de esta pantalla. Todo lo
 * demas -- colores, botones, tablas, mensajes-- sale de homesi.css sobre los
 * tokens de marca.
 */
html, body { height: 100% }
.wrap { display: grid; grid-template-columns: 340px 1fr; height: calc(100% - 52px) }
@media (max-width: 860px){ .wrap { grid-template-columns: 1fr } .side { display: none } }
.side { border-right: 1px solid var(--slate-200); display: flex;
  flex-direction: column; min-height: 0; background: var(--white) }
.filtros { padding: 14px; border-bottom: 1px solid var(--slate-200); display: grid; gap: 8px }
.filtros label { margin: 0 }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.cuenta { padding: 9px 14px; font: 600 11px/1.3 var(--font-mono);
  font-variant-numeric: tabular-nums; color: var(--slate-500);
  border-bottom: 1px solid var(--slate-200) }
.listaSide { overflow: auto; flex: 1; min-height: 0 }
.fila { padding: 11px 14px; border-bottom: 1px solid var(--slate-200);
  cursor: pointer; display: flex; gap: 10px; align-items: flex-start }
.fila:hover { background: var(--accent-soft) }
.fila.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--coral) }
.punto { width: 7px; height: 7px; border-radius: var(--radius-full);
  margin-top: 6px; flex: none; background: var(--slate-300) }
.punto.si { background: var(--emerald-700) }
.fila .n { font-weight: 700; font-size: 13px; color: var(--navy) }
.fila .m { color: var(--slate-500); font-size: 11px }
.fila .m b { font-family: var(--font-mono); font-variant-numeric: tabular-nums }
.main { overflow: auto; min-height: 0; padding: 22px 24px 60px }
.main h1 { font: 800 21px/1.2 var(--font-display); color: var(--navy);
  margin: 0 0 3px; letter-spacing: -.02em }
.vacio { color: var(--slate-400); padding: 52px 10px; text-align: center; font-size: 13px }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px }
</style>
</head>
<body>
<header class="hub-header">
  <span class="marca"></span>
  <h1>HomeSí Prospector</h1>
  <span class="sub" id="estadoGlobal">cargando…</span>
  <span class="sub">PACS-H</span>
</header>

<div class="wrap">
  <aside class="side">
    <div class="filtros">
      <input type="search" id="q" placeholder="Buscar por nombre, brokerage o email">
      <div class="frow">
        <select id="fEstado"><option value="">Todos los estados</option></select>
        <select id="fMM">
          <option value="">Con y sin Model Match</option>
          <option value="si">Solo con Model Match</option>
          <option value="no">Solo sin Model Match</option>
        </select>
      </div>
    </div>
    <div class="cuenta" id="cuenta"></div>
    <div class="listaSide" id="lista"></div>
  </aside>
  <main class="main" id="detalle">
    <div class="vacio">Elegí un realtor de la lista para abrir su ficha.</div>
  </main>
</div>

<div class="velo" id="velo"></div>
<aside class="panel" id="panel"></aside>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let FILAS = [], SEL = null, TAB = 'mercados', GEO = [], FORZAR = false;
let VENTANA_CONFIRMADA = false;

async function api(ruta, opciones){
  const r = await fetch(ruta, opciones);
  const j = await r.json().catch(() => ({error:'respuesta no-JSON'}));
  if(!r.ok){
    const e = new Error(j.error || ('HTTP ' + r.status));
    e.status = r.status; e.datos = j;
    throw e;
  }
  return j;
}

/* ── lista lateral ────────────────────────────────────────────────────── */
async function cargarLista(){
  const p = new URLSearchParams();
  if($('#q').value.trim()) p.set('q', $('#q').value.trim());
  if($('#fEstado').value) p.set('estado', $('#fEstado').value);
  if($('#fMM').value) p.set('mm', $('#fMM').value);
  $('#cuenta').textContent = 'buscando…';
  try{
    const d = await api('/api/realtors?' + p.toString());
    FILAS = d.filas;
    ESTADOS = d.estados || ESTADOS;
    $('#cuenta').textContent = d.truncado
      ? `${d.mostradas} de ${d.total} · afiná la búsqueda para ver el resto`
      : `${d.mostradas} de ${d.total}`;
    pintarLista();
    llenarEstados();
  }catch(e){
    $('#cuenta').textContent = '';
    $('#lista').innerHTML = `<div class="err" style="margin:12px">${esc(e.message)}</div>`;
  }
}

/* El código de dos letras es el valor; el nombre completo es lo que se ve.
   El mapa viene del servidor: escribirlo también acá sería un segundo sitio
   donde puede divergir, que es justo el bug que se acaba de arreglar. */
let ESTADOS = {};
function llenarEstados(){
  const sel = $('#fEstado');
  if(sel.options.length > 1) return;
  const vistos = [...new Set(FILAS.map(f => f.estado).filter(Boolean))]
    .sort((a,b) => (ESTADOS[a]||a).localeCompare(ESTADOS[b]||b));
  vistos.forEach(e => sel.insertAdjacentHTML('beforeend',
    `<option value="${esc(e)}">${esc(ESTADOS[e] || e)}</option>`));
}

function pintarLista(){
  $('#lista').innerHTML = FILAS.map(f => `
    <div class="fila ${SEL && SEL.id===f.id ? 'sel' : ''}" data-id="${f.id}">
      <span class="punto ${f.sf_lead_id ? 'si' : ''}"
            title="${f.sf_lead_id ? 'con Lead ID' : 'sin llave dura'}"></span>
      <span>
        <div class="n">${esc(f.nombre_completo)}</div>
        <div class="m">${esc(f.brokerage || '—')} · ${esc(f.estado || '—')}
          ${f.unidades_ano != null ? ' · ' + f.unidades_ano + ' u/año' : ''}</div>
      </span>
    </div>`).join('') || '<div class="vacio">Nada con esos filtros.</div>';
  document.querySelectorAll('.fila').forEach(el =>
    el.onclick = () => abrir(el.dataset.id));
}

function abrir(id){
  SEL = FILAS.find(f => f.id === id);
  /* Abre por la LECTURA, que es lo que se mira primero. Capturar es una
     acción; leer es para lo que se abre una ficha. */
  TAB = 'lectura';
  pintarLista();
  pintarFicha();
}

/* ── ficha ────────────────────────────────────────────────────────────── */
/* `Model Match` YA no está deshabilitada: no necesita el motor, sólo lee
   `parseado` de la base y lo muestra. Las otras siguen apagadas porque su
   contenido sí se consume del motor de Python. */
/* `Dossier A–G` y `Secuencia 60 días` siguen apagadas, y NO por el motor:
   nadie ha verificado que existan los recursos que el copy promete. Hasta que
   eso pase, cada toque que prometa un recurso va marcado recurso_sin_verificar
   y la secuencia no sale. */
const PESTANAS = [
  ['lectura','Lectura del perfil',true],
  ['calculo','Cómo se calculó',true],
  ['mm','Model Match',true],
  ['mercados','Mercados',true],
  ['ig','Instagram',true],
  ['dossier','Dossier A–G',true],
  ['seq','Secuencia 60 días',true],
];
const PORQUE_APAGADA = {};

function pintarFicha(){
  if(!SEL){ $('#detalle').innerHTML = '<div class="vacio">Elegí un realtor.</div>'; return }
  const tabs = PESTANAS.map(([k,t,activa]) =>
    `<button class="tab" role="tab" aria-selected="${TAB===k}" data-tab="${k}"
      ${activa?'':'disabled'}
      title="${activa?'':esc(PORQUE_APAGADA[k]||'todavía no')}">${t}</button>`
  ).join('');
  $('#detalle').innerHTML = `
    <h1>${esc(SEL.nombre_completo)}</h1>
    <p class="sub">${esc(SEL.brokerage || '—')} ·
      ${esc(ESTADOS[SEL.estado] || SEL.estado || '—')}
      ${SEL.sf_lead_id ? ' · Lead ' + esc(SEL.sf_lead_id) : ' · <b>sin llave dura</b>'}</p>
    <div class="tabs" role="tablist">${tabs}</div>
    <div id="cuerpo"></div>`;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    TAB = b.dataset.tab; pintarFicha();
  });
  if(TAB === 'mercados') vMercados();
  if(TAB === 'mm') vModelMatch();
  if(TAB === 'lectura' || TAB === 'calculo') vLectura(TAB);
  if(TAB === 'ig') vInstagram();
  if(TAB === 'dossier' || TAB === 'seq') vDossier(TAB);
}

/* ══ DOSSIER Y SECUENCIA ═══════════════════════════════════════════════════
 * Salen sin esperar a que se verifiquen los recursos, porque se quitaron las
 * promesas de material: el valor va DENTRO del mensaje.
 */
async function vDossier(cual){
  $('#cuerpo').innerHTML = '<div class="tarjeta pista">cargando…</div>';
  try{
    const d = await api('/api/dossier?realtor_id=' + encodeURIComponent(SEL.id));
    $('#cuerpo').innerHTML = cual === 'seq' ? vistaSecuencia(d) : vistaDossier(d);
  }catch(e){
    $('#cuerpo').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

function pendientes(d){
  const rs = d.recursos_pendientes || [];
  const sin = rs.filter(r => !r.verificado);
  return `<div class="tarjeta">
    <div class="seccion">Recursos · pendientes de verificar</div>
    <span class="badge ${sin.length ? 'bloqueado' : 'mql'}">
      <i>${sin.length ? '▲' : '✓'}</i>${sin.length} de ${rs.length} sin confirmar</span>
    <p class="sub" style="margin-top:8px">Ninguno se promete en el copy. Cuando
      alguien confirme cuáles existen, vuelven como <b>refuerzo</b>, no como
      promesa.</p>
    <ul class="lista" style="margin-top:10px">${rs.map(r => `
      <li><b>${esc(r.clave)}</b>
        <span class="pista">${esc(r.descripcion)}</span>
        <span class="badge ${r.verificado ? 'mql' : 'sin-evaluar'}"
          style="margin-left:auto"><i>${r.verificado ? '✓' : '·'}</i>${
          r.verificado ? 'verificado' : 'sin verificar'}</span></li>`).join('')}
    </ul></div>`;
}

function vistaDossier(d){
  const c = d.cabecera || {};
  const [cn, ci] = NIVEL_BADGE[c.nivel] || ['sin-evaluar','▣'];

  const bloque = b => {
    /* El bloque F se pinta distinto: es una lista de no/sí, no un dato. */
    if(b.letra === 'F') return `<div class="tarjeta"
      style="border-color:var(--coral)">
      <div class="seccion" style="color:var(--rose-700)">F · ${esc(b.titulo.replace(/^.*·\s*/,''))}</div>
      ${b.datos.map(x => `<div style="border-left:3px solid var(--rose-200);
        padding:8px 0 8px 12px;margin-top:10px">
        <p style="margin:0;font-size:13px;font-weight:700;color:var(--rose-700)">
          ${esc(x.no)}</p>
        <p style="margin:4px 0 0;font-size:13px;color:var(--emerald-800)">
          <b>En su lugar:</b> ${esc(x.si)}</p>
        <p class="pista" style="margin:4px 0 0">${esc(x.por_que)}</p>
      </div>`).join('')}
      <p class="sub" style="margin-top:12px">${esc(b.fuente)}</p></div>`;

    if(b.vacio_porque && !b.texto && !b.datos.length) return `<div class="tarjeta">
      <div class="seccion">${esc(b.letra)} · ${esc(b.titulo)}</div>
      <span class="badge sin-evaluar"><i>▣</i>sin dato</span>
      <p class="sub" style="margin-top:8px">${esc(b.vacio_porque)}</p></div>`;

    return `<div class="tarjeta">
      <div class="seccion">${esc(b.letra)} · ${esc(b.titulo)}</div>
      ${b.texto ? `<p style="margin:8px 0 0;font-size:${b.letra==='E'?'15px':'13px'};
        line-height:1.65;color:var(--${b.letra==='E'?'navy':'slate-800'});
        font-weight:${b.letra==='E'?'700':'500'}">${esc(b.texto)}</p>` : ''}
      ${b.datos.length ? `<ul class="lista" style="margin-top:10px">${
        b.datos.filter(x=>x.v!=null&&x.v!=='').map(x =>
        `<li><b>${esc(x.k)}</b><span class="${typeof x.v==='number'?'num':''}"
          style="margin-left:auto;text-align:right">${esc(x.v)}</span></li>`
      ).join('')}</ul>` : ''}
      ${b.vacio_porque ? `<p class="sub" style="margin-top:8px">${esc(b.vacio_porque)}</p>` : ''}
      ${b.fuente ? `<p class="pista" style="margin-top:8px">${esc(b.fuente)}</p>` : ''}
    </div>`;
  };

  return `
    <div class="banner">
      <div class="seccion">Dossier A–G · ${esc(d.realtor.nombre_mostrado)}</div>
      <span class="badge ${cn}" style="font-size:13px;padding:6px 12px">
        <i>${ci}</i>${esc(c.nivel || '—')}</span>
      <span class="cifra" style="margin-left:12px;font-size:18px">${esc(d.dolor_primario || 'sin dolor primario')}</span>
      <span class="pista" style="margin-left:10px">${esc(d.realtor.estado_nombre || '')}
        · ${d.mercados} mercados</span>
    </div>
    ${(d.bloques||[]).map(bloque).join('')}
    ${pendientes(d)}`;
}

function vistaSecuencia(d){
  const s = d.secuencia;
  return `
    <div class="banner">
      <div class="seccion">Secuencia de 60 días</div>
      <span class="cifra ${s.promete_material ? '' : 'bien'}">${s.toques.length} toques</span>
      <span class="pista" style="margin-left:10px">${
        s.promete_material ? 'PROMETE MATERIAL' : 'sin una sola promesa de material'}</span>
    </div>
    ${s.toques.map(t => `
      <div class="tarjeta">
        <div class="seccion">Toque ${t.numero} · día ${t.dia} · ${esc(t.canal)}</div>
        <p style="margin:8px 0;font-size:13px;line-height:1.7;white-space:pre-wrap;color:var(--slate-800)">${esc(t.cuerpo)}</p>
        ${t.fuente_del_valor ? `<p class="sub" style="margin:0">
          <b>Valor:</b> ${esc(t.fuente_del_valor)}</p>` : ''}
      </div>`).join('')}
    ${s.notas.map(n => `<div class="avi">${esc(n)}</div>`).join('')}
    ${pendientes(d)}`;
}

/* ── pestaña Instagram · lo capturado, sin motor ──────────────────────────── */
async function vInstagram(){
  $('#cuerpo').innerHTML = '<div class="tarjeta pista">cargando…</div>';
  try{
    const d = await api('/api/instagram?realtor_id=' + encodeURIComponent(SEL.id));
    if(!d.perfiles.length){
      $('#cuerpo').innerHTML = `<div class="tarjeta">
        <div class="seccion">Instagram</div>
        <span class="badge sin-evaluar"><i>▣</i>sin raspado vigente</span>
        <p class="sub" style="margin-top:8px">Este realtor no tiene señales en
          <code>v_ig_senales_current</code>. Puede que el raspado no lo haya
          alcanzado todavía, o que su lote esté apagado.</p></div>`;
      return;
    }
    $('#cuerpo').innerHTML = d.perfiles.map(p => `
      <div class="tarjeta">
        <div class="seccion">Perfil capturado</div>
        <h2>@${esc(p.handle || '—')}</h2>
        <div style="margin:8px 0">
          <span class="badge ${esc(p.estado_clase)}"><i>◉</i>${esc(p.estado_etiqueta)}</span>
          ${p.handle_confianza ? `<span class="badge sin-evaluar"><i>?</i>handle ${esc(p.handle_confianza)}</span>` : ''}
          ${p.paginacion_truncada ? '<span class="badge bloqueado"><i>▲</i>paginación truncada</span>' : ''}
        </div>
        ${p.estado_evidencia ? `<p class="sub">Evidencia del estado:
          <code>${esc(p.estado_evidencia)}</code></p>` : ''}
        <div class="grid2" style="margin-top:12px">
          <div><span class="pista">publicaciones leídas</span><br>
            <span class="kpi chico">${p.captions_n ?? '—'}</span></div>
          <div><span class="pista">comentarios</span><br>
            <span class="kpi chico">${p.comentarios_n ?? '—'}</span></div>
          <div><span class="pista">capturado</span><br>
            <span class="num">${esc((p.capturado_en||'').slice(0,10))}</span></div>
        </div>
      </div>
      ${p.destacadas.length ? `<div class="tarjeta">
        <div class="seccion">Señales</div>
        <div class="tbl-scroll" style="margin-top:10px">
          <table class="piv"><thead><tr>
            <th class="lbl">Señal</th><th class="totcol">Valor</th>
          </tr></thead><tbody>${p.destacadas.map(s => `
            <tr class="metric"><td class="lbl">${esc(s.etiqueta)}</td>
              <td class="totcol">${esc(s.valor)}</td></tr>`).join('')}
          </tbody></table>
        </div>
        <p class="pista" style="margin-top:8px">El desajuste de idioma es
          comentarios menos publicaciones, sobre piezas clasificables: el 26% de
          los comentarios son sólo emoji y no tienen idioma.</p>
      </div>` : ''}
      <div class="tarjeta">
        <div class="seccion">Todo lo derivado</div>
        <p class="sub">Cada etiqueta lleva el texto que la produjo. Las citas
          van sin autor: nadie se perfila individualmente.</p>
        <ul class="lista" style="margin-top:10px">${
          Object.entries(p.senales).map(([k,v]) =>
            `<li><b>${esc(k)}</b><span class="num" style="margin-left:auto">${esc(String(v).slice(0,140))}</span></li>`
          ).join('')}</ul>
      </div>`).join('');
  }catch(e){
    $('#cuerpo').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

/* ══ LECTURA DEL PERFIL · y CÓMO SE CALCULÓ ════════════════════════════════
 * La misma información a dos profundidades: arriba lo que se lee, abajo de
 * dónde salió. Se piden en una sola llamada para que no puedan discrepar.
 */
const VEREDICTO_BADGE = {
  'es nuestro cliente':            ['mql', '✓'],
  'no es nuestro cliente':         ['excluido', '⛔'],
  'fricción que podemos resolver': ['bloqueado', '▲'],
  'señal de alerta':               ['excluido', '⚠'],
  'neutro':                        ['sin-evaluar', '▣'],
};

async function vLectura(cual){
  $('#cuerpo').innerHTML = '<div class="tarjeta pista">cargando…</div>';
  try{
    const d = await api('/api/lectura?realtor_id=' + encodeURIComponent(SEL.id));
    LECTURA = d;
    $('#cuerpo').innerHTML = cual === 'lectura' ? vistaLectura(d) : vistaCalculo(d);
  }catch(e){
    $('#cuerpo').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}
let LECTURA = null;

const NIVEL_BADGE = {
  'MQL': ['mql','✓'], 'PRE-MQL': ['bloqueado','▲'],
  'EXCLUIDO': ['excluido','⛔'], 'BLOQUEADO': ['excluido','⛔'],
  'SIN EVALUAR': ['sin-evaluar','▣'],
};
const barras = n => '█'.repeat(n||0) + '·'.repeat(Math.max(0, 3-(n||0)));

function vistaLectura(d){
  const c = d.cabecera || {};
  const conf = c.confianza || {};
  const [cn, ci] = NIVEL_BADGE[c.nivel] || ['sin-evaluar','▣'];

  /* Con más de una captura, decirlo: un diagnóstico que cambió porque alguien
     re-capturó tiene que ser visible, no una sorpresa. */
  const cap = d.capturas || {};
  const aviso_capturas = cap.anteriores > 0 ? `<div class="avi">
    <b>Hay ${cap.lotes} capturas de Model Match de este realtor.</b>
    Manda la más reciente (${esc((cap.vigente_desde||'').slice(0,16).replace('T',' '))});
    ${cap.anteriores === 1 ? 'la anterior queda' : 'las ' + cap.anteriores + ' anteriores quedan'}
    como histórico en la pestaña <b>Model Match</b> y no alimenta el diagnóstico.
    Un perfil describe un momento, y mezclar dos no da un momento mejor.</div>` : '';

  /* 1 · quién es, en prosa. Es lo primero que un BD lee. */
  const quien = aviso_capturas + `<div class="tarjeta">
    <div class="seccion">Qué clase de realtor es</div>
    <p style="margin:6px 0 0;font-size:14px;line-height:1.7;color:var(--slate-800)">
      ${esc(d.narrativa || '')}</p></div>`;

  /* 2 · su nivel y su confianza. */
  const cab = `<div class="banner">
    <div class="seccion">Diagnóstico</div>
    <span class="badge ${cn}" style="font-size:13px;padding:6px 12px">
      <i>${ci}</i>${esc(c.nivel || '—')}</span>
    <span class="cifra" style="margin-left:12px;font-size:18px">${esc(c.dolor_primario || 'sin dolor primario')}</span>
    ${c.acto_de_habla ? `<span class="pista" style="margin-left:10px">acto de habla:
      <b style="color:var(--sky)">${esc(c.acto_de_habla)}</b></span>` : ''}
    ${c.gating && c.gating.qualifier ? `<div class="pista" style="margin-top:8px">
      compuerta: ${esc(c.gating.qualifier)} en fuerza
      <span class="num">${c.gating.intensidad ?? '—'}</span>/3</div>` : ''}
  </div>
  <div class="tarjeta">
    <div class="seccion">Confianza del diagnóstico · ${esc(conf.nivel || '—')}</div>
    <p class="sub">No es un porcentaje: es qué términos están y cuáles no.</p>
    <ul class="lista" style="margin-top:10px">${(conf.terminos||[]).map(t => `
      <li><span class="badge ${t.presente ? 'mql' : 'sin-evaluar'}">
        <i>${t.presente ? '✓' : '·'}</i>${esc(t.nombre)}</span>
        <span class="pista">${esc(t.detalle)}</span></li>`).join('')}
    </ul></div>`;

  /* 3 · las hipótesis, con enunciado, fuerza y de dónde salieron. */
  const hip = (d.hipotesis||[]).length ? `<div class="tarjeta">
    <div class="seccion">Hipótesis de dolor</div>
    <p class="sub">El enunciado viene de la matriz PACS-H. Que le aplique a
      esta persona es una hipótesis: la regla que la activó está en cada fila.</p>
    ${d.hipotesis.map(h => `
      <div style="border-left:3px solid ${h.papel==='principal'?'var(--coral)':'var(--slate-200)'};
        padding:10px 0 10px 12px;margin-top:12px">
        <div>
          <b style="color:var(--navy)">${esc(h.qualifier)}</b>
          <span class="badge ${h.papel==='principal'?'excluido':'sin-evaluar'}"
            style="margin-left:6px"><i>◉</i>${esc(h.papel)}</span>
          <span class="num" style="margin-left:6px">${h.intensidad ?? '—'}/3</span>
          <span class="num" style="letter-spacing:2px;color:var(--coral)">${barras(h.intensidad)}</span>
          <span class="badge sin-evaluar" style="margin-left:6px"><i>E</i>${esc(h.grado||'')}</span>
        </div>
        <p style="margin:8px 0 0;font-size:13px;line-height:1.6;color:var(--slate-800)">
          ${esc(h.enunciado || '(este qualifier no está en el banco de la matriz)')}</p>
        <p class="pista" style="margin:6px 0 0">Se activó porque:
          ${esc(h.regla||'—')} <code>${esc(h.regla_id||'')}</code> · ${esc(h.origen||'')}</p>
        ${h.angulo ? `<p style="margin:8px 0 0;font-size:13px">
          <b style="color:var(--navy)">Ángulo:</b> ${esc(h.angulo)}</p>` : ''}
        ${h.municion ? `<p style="margin:4px 0 0;font-size:13px">
          <b style="color:var(--navy)">Munición:</b> ${esc(h.municion)}</p>` : ''}
        ${h.escala ? `<p class="pista" style="margin:6px 0 0">Escala: ${esc(h.escala)}</p>` : ''}
      </div>`).join('')}</div>` : '';

  /* 5 · el contraste, SOLO contra el condado dominante. */
  const contr = (d.lecturas||[]).map(l => {
    const [clase, icono] = VEREDICTO_BADGE[l.bueno_o_malo] || ['sin-evaluar','▣'];
    return `<div class="tarjeta">
      <div class="seccion">${esc(l.titulo)}${l.papel!=='canal'?` · ${esc(l.papel)}`:''}</div>
      <span class="badge ${clase}"><i>${icono}</i>${esc(l.bueno_o_malo)}</span>
      ${l.afirma ? '' : '<span class="badge sin-evaluar"><i>?</i>no afirma: pregunta</span>'}
      ${l.veces ? `<span class="num" style="margin-left:8px;font-size:16px;font-weight:800;color:var(--navy)">${String(l.veces).replace('.',',')}×</span>` : ''}
      <p style="margin:10px 0 0;font-size:13px;line-height:1.6;color:var(--slate-800)">
        ${esc(l.que_dice_del_borrower)}</p>
      <div class="seccion" style="margin-top:12px">Qué hacer</div>
      <p style="margin:0;font-size:13px;line-height:1.6;color:var(--navy);font-weight:600">
        ${esc(l.que_hacer)}</p></div>`;
  }).join('');

  const nota_sec = (d.lecturas_secundarias||[]).length
    ? `<div class="avi">Los otros ${d.lecturas_secundarias.length} contrastes
       — ${esc(d.lecturas_secundarias.map(l=>l.geografia).join(', '))} —
       dicen lo mismo con otro mercado y están en <b>Cómo se calculó</b>.
       En la lectura solo va su condado dominante.</div>`
    : '';

  /* 7 · si podemos originarle. */
  const cov = d.cobertura || {};
  const originar = `<div class="tarjeta">
    <div class="seccion">¿Podemos originarle?</div>
    ${cov.activos == null
      ? `<span class="badge bloqueado"><i>▲</i>no lo sabemos</span>
         <p class="sub" style="margin-top:8px">${esc(cov.razon||'')}</p>`
      : cov.activos === 0
        ? `<span class="badge excluido"><i>⛔</i>no tenemos licencia en
           ${esc(d.realtor.estado_nombre||'')}</span>
           <p class="sub" style="margin-top:8px">Califica comercialmente y hoy
             no podemos originarle. Activarlo sería gastar credibilidad en una
             promesa que no podemos cumplir.</p>`
        : `<span class="badge mql"><i>✓</i>sí</span>
           <span class="kpi chico" style="margin-left:8px">${cov.activos}</span>
           <span class="pista">loan officers con licencia</span>`}
  </div>`;

  return quien + cab + hip + contr + nota_sec + vistaZona(d) + originar +
    (d.sin_dolor ? vistaSinDolor(d) : '');
}

    <p style="margin:6px 0 0;font-size:13px;line-height:1.65">

function vistaCalculo(d){
  const ev = d.evaluacion;

    ? `<ul class="lista">${xs.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`
    : `<p class="sub">${vacio}</p>`;

  return `
    <div class="tarjeta">
      <div class="seccion">Diagnóstico</div>
      <div class="grid2" style="margin-top:10px">
        <div><span class="pista">dolor primario</span><br>
          <b style="color:var(--navy)">${esc(ev.dolor_primario || '—')}</b></div>
        <div><span class="pista">gating</span><br>
          <b style="color:var(--navy)">${esc(ev.gating_qualifier || '—')}</b>
          <span class="num">${ev.gating_intensidad ?? ''}</span></div>
        <div><span class="pista">apertura</span><br>
          <b style="color:var(--navy)">${esc(ev.apertura || '—')}</b></div>
        <div><span class="pista">reglas</span><br>

    <div class="tarjeta">
      <div class="seccion">La cadena de evidencia de cada lectura</div>

      ${lista(ev.campos_ausentes, 'ningún campo ausente')}
      <div class="seccion" style="margin-top:14px">Reglas no evaluadas</div>
      <p class="num" style="font-size:18px;font-weight:800;color:var(--navy)">
        ${(ev.no_evaluadas||[]).length}</p>
    </div>`;
}

/* ══ LA CONFIRMACIÓN ═══════════════════════════════════════════════════════
 * Lo mismo se pinta al guardar y al auditar una captura vieja: si se vieran
 * distinto habría que aprender dos pantallas para leer el mismo dato.
 */
const dinero = v => v == null ? '—'
  : v >= 1e9 ? '$' + (v/1e9).toFixed(1) + 'B'
  : v >= 1e6 ? '$' + (v/1e6).toFixed(1) + 'M'
  : '$' + Math.round(v/1e3) + 'K';
const pct = v => v == null ? '—' : v.toFixed(1).replace('.', ',') + '%';

function pintarResumen(r){
  if(!r) return '';
  const secc = r.secciones.map(s => {
    const donde = s.seccion === 'market_signals'
      ? `<span class="badge sin-evaluar"><i>▣</i>${s.nivel === 'estado' ? 'estado' : 'condado'}
         · ${esc(s.etiqueta || '—')}</span>`
      : '';
    return `<li><b>${esc(s.seccion)}</b> ${donde}
      <span class="pista num" style="margin-left:auto">${s.caracteres.toLocaleString('es')} car.</span></li>`;
  }).join('');

  const geo = r.geografias.map(g => `
    <tr class="metric ${g.volumen_repetido ? 'repetido' : ''}">
      <td class="lbl">${esc(g.etiqueta || '(estado)')}</td>
      <td>${esc(g.nivel || '—')}</td>
      <td>${dinero(g.total_volume)}</td>
      <td>${pct(g.mkt_fha)}</td>
      <td>${pct(g.fallout)}</td>
      <td class="totcol">${g.campos == null ? '—' : g.campos}</td>
    </tr>`).join('');

  const repes = (r.volumenes_repetidos || []).length
    ? `<div class="err"><b>Dos geografías con el mismo volumen:</b>
        ${r.volumenes_repetidos.map(n => esc(n.join(' y '))).join('; ')}.
        Eso es el Rolling Monthly Performance, que no respeta el filtro de
        ubicación. Hay que copiar la sección <b>Market Overview</b>.</div>`
    : '';

  const orig = r.originadores.length ? r.originadores.map(o => `
      <li><b>${esc(o.nombre || '—')}</b>
        <span class="pista">${esc(o.empresa || '—')}</span>
        ${o.de_la_casa
          ? '<span class="badge excluido"><i>⛔</i>de la casa</span>' : ''}
        <span class="num" style="margin-left:auto">${o.unidades ?? '—'} u · ${pct(o.share)}</span></li>`).join('')
    : '<li class="pista">sin relaciones de originador en esta captura</li>';

  /* Banner oscuro: la cifra que decide la exclusión, en Soft Sky y mono. */
  const casa = r.share_de_la_casa || {};
  const banner = casa.share != null
    ? `<div class="banner">
         <div class="seccion">Exclusión por no-canibalización · base ${esc(casa.base || '')}</div>
         <span class="cifra ${casa.share > 0 ? '' : 'bien'}">${pct(casa.share)}</span>
         <span class="pista num" style="margin-left:10px">${casa.unidades} de
           ${casa.unidades_totales} unidades del reparto</span>
         ${(casa.originadores||[]).length
           ? '<div class="pista" style="margin-top:6px">' +
             esc(casa.originadores.join(' · ')) + '</div>' : ''}
       </div>`
    : `<div class="banner">
         <div class="seccion">Exclusión por no-canibalización</div>
         <span class="badge bloqueado"><i>▲</i>no se pudo calcular</span>
         <div class="pista" style="margin-top:8px">${esc(casa.razon || '')}</div>
       </div>`;

  const fallos = (r.fallos || []).length
    ? `<div class="tarjeta">
        <div class="seccion">Fallos de lectura</div>
        <p class="sub">Secciones que venían en el texto y quedaron vacías. El
          crudo está guardado: se arregla el parser y se re-deriva sin volver a
          capturar.</p>
        ${r.fallos.map(f => `<div class="avi"><b>${esc(f.seccion)}</b> →
          <code>${esc(f.campo)}</code><br>${esc(f.por_que_importa || '')}</div>`).join('')}</div>`
    : `<div class="tarjeta">
        <div class="seccion">Fallos de lectura</div>
        <span class="badge mql"><i>✓</i>ninguno</span>
        <span class="sub" style="margin-left:8px">Todas las secciones presentes
          en el texto llegaron a un campo.</span></div>`;

  const p = r.perfil || {};
  const guardia = p.cobertura_mix != null && p.cobertura_mix < 50;
  return `
    ${banner}
    ${repes}
    <div class="tarjeta">
      <div class="seccion">Bloques separados</div>
      <h2>${r.secciones.length} secciones, en orden de captura</h2>
      <ul class="lista" style="margin-top:10px">${secc}</ul>
    </div>
    <div class="tarjeta">
      <div class="seccion">Por geografía</div>
      <h2>Volumen, FHA del mercado y fallout</h2>
      <p class="sub" style="margin-bottom:10px">Si dos filas repiten volumen,
        salen en rojo: es la firma del gráfico rodante.</p>
      <div class="tbl-scroll">
        <table class="piv">
          <thead><tr>
            <th class="lbl">Geografía</th><th>Nivel</th><th>Volumen</th>
            <th>FHA</th><th>Fallout</th><th class="totcol">Campos</th>
          </tr></thead>
          <tbody>${geo || '<tr class="metric"><td class="lbl">—</td></tr>'}</tbody>
        </table>
      </div>
    </div>
    <div class="tarjeta">
      <div class="seccion">Originadores · reparto por unidades</div>
      <ul class="lista" style="margin-top:10px">${orig}</ul>
    </div>
    <div class="tarjeta">
      <div class="seccion">Perfil</div>
      <div class="grid2" style="margin-top:12px">
        <div><span class="pista">nombre</span><br>
          <b style="color:var(--navy)">${esc(p.nombre || '—')}</b></div>
        <div><span class="pista">buyer units</span><br>
          <span class="kpi chico">${p.buyer_units ?? '—'}</span></div>
        <div><span class="pista">TPO del agente</span><br>
          <span class="kpi chico">${pct(p.tpo_pct)}</span></div>
        <div><span class="pista">lenders</span><br>
          <span class="kpi chico">${p.lenders ?? 0}</span></div>
        <div><span class="pista">cobertura del mix</span><br>
          <span class="kpi chico">${pct(p.cobertura_mix)}</span>
          ${guardia ? '<br><span class="badge bloqueado"><i>▲</i>no pasa la guardia</span>' : ''}</div>
      </div>
    </div>
    ${fallos}`;
}

/* ── panel lateral · el crudo tal como se pegó ────────────────────────────── */
let CAPTURAS = [];
function abrirPanel(i, j){
  const b = (CAPTURAS[i] || {}).bloques[j];
  if(!b) return;
  $('#panel').innerHTML = `
    <button class="btn sec cerrar" id="cerrarPanel">Cerrar</button>
    <div class="seccion">${esc(b.seccion)}${b.nivel ? ' · ' + esc(b.nivel) : ''}</div>
    <h2>${esc(b.etiqueta || 'sin etiqueta geográfica')}</h2>
    <p class="sub"><span class="num">${b.caracteres.toLocaleString('es')}</span>
      caracteres, tal como se pegaron</p>
    <div class="crudo">${esc(b.texto_crudo)}</div>`;
  $('#cerrarPanel').onclick = cerrarPanel;
  $('#panel').classList.add('abierto');
  $('#velo').classList.add('abierto');
}
function cerrarPanel(){
  $('#panel').classList.remove('abierto');
  $('#velo').classList.remove('abierto');
}

/* ── pestaña Model Match · lo capturado, desde la base ────────────────────── */
async function vModelMatch(){
  $('#cuerpo').innerHTML = '<div class="tarjeta pista">cargando capturas…</div>';
  try{
    const d = await api('/api/capturas?realtor_id=' + encodeURIComponent(SEL.id));
    if(!d.capturas.length){
      $('#cuerpo').innerHTML = `<div class="tarjeta">
        <h2>Model Match</h2>
        <p class="sub" style="margin:0">Este realtor no tiene capturas vigentes.
          Se pegan desde la pestaña <b>Mercados</b>.</p></div>`;
      return;
    }
    CAPTURAS = d.capturas;
    /* La más reciente es la que manda; las otras son histórico. Se dice en
       cada tarjeta, no solo arriba. */
    $('#cuerpo').innerHTML = (d.capturas.length > 1 ? `<div class="avi">
      Hay ${d.capturas.length} capturas. <b>Manda la primera</b>, que es la más
      reciente. Las demás quedan como histórico y no alimentan el
      diagnóstico.</div>` : '') + d.capturas.map((c, i) => `
      <div class="tarjeta">
        <div class="seccion">Captura ${d.capturas.length - i} de ${d.capturas.length}</div>
        <span class="badge ${i === 0 ? 'mql' : 'sin-evaluar'}">
          <i>${i === 0 ? '✓' : '·'}</i>${i === 0 ? 'manda' : 'histórico'}</span>
        <h2>${esc((c.capturado_en || '').slice(0,16).replace('T',' '))} ·
          ${esc(c.estado || '—')}</h2>
        <p class="sub" style="margin-bottom:10px">
          <span class="num">${c.caracteres.toLocaleString('es')}</span> caracteres ·
          <code>${esc(c.version_parser || '')}</code></p>
        <div>${(c.bloques||[]).map((b,j) => `
          <button class="btn sec" style="margin:0 6px 6px 0;padding:6px 11px"
            data-cap="${i}" data-blo="${j}">
            ${esc(b.etiqueta || b.seccion)} · <span class="num">${b.caracteres.toLocaleString('es')}</span></button>`).join('')}
        </div>
        <p class="pista" style="margin:6px 0 0">El crudo es lo único que no se
          puede re-derivar de otra cosa: todo lo demás sale de él.</p>
      </div>` + pintarResumen(c.resumen)).join('');
    document.querySelectorAll('[data-cap]').forEach(b => b.onclick = () =>
      abrirPanel(+b.dataset.cap, +b.dataset.blo));
  }catch(e){
    $('#cuerpo').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

/* ── pestaña Mercados · el pegado va acá, dentro de la ficha ──────────── */
function vMercados(){
  $('#cuerpo').innerHTML = `
    <div class="tarjeta">
      <h2>Pegar Model Match</h2>
      <p class="sub" style="margin:0 0 12px">Una sola caja. Recorré el perfil en
        este orden y pegá todo seguido acá:
        <b>1</b> Overview con <i>View Counties</i> ·
        <b>2</b> Market Signals del estado ·
        <b>3</b> Market Signals de cada condado, en el orden del Overview ·
        <b>4</b> Originators con filtro Buyer · <b>5</b> Lenders.<br>
        Los cortes los encuentra el servidor por los títulos de sección; no hay
        que separar nada.</p>
      <div id="msgs"></div>
      <label>Volcado completo
        <span class="pista">Ctrl+A, Ctrl+C en cada pestaña, una debajo de otra</span></label>
      <textarea id="volcado" style="min-height:320px"
        placeholder="Pegá acá el perfil entero, en orden."></textarea>
      <label>Ventana de Model Match
        <span class="pista">el <b>Set Date Range</b> del perfil, en meses. No
          viaja en el texto pegado: vive en un desplegable, igual que Set
          Location. Sin ella no se puede anualizar la producción.</span></label>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <input type="number" id="ventana" min="1" max="60" value="14"
          style="max-width:110px">
        <span class="badge sin-evaluar" id="ventanaOrigen"><i>·</i>el de fábrica</span>
      </div>
      <div id="extra"></div>
      <div style="margin-top:12px">
        <button class="btn" id="btnGuardar">Guardar</button>
        <span class="pista" id="tam"></span>
      </div>
    </div>
    <div id="confirmacion"></div>
    <div class="tarjeta">
      <h2>Biblioteca de geografías</h2>
      <div id="biblio" class="pista">cargando…</div>
    </div>`;
  if(!SEL.sf_lead_id) $('#extra').innerHTML =
    `<label>MMI Agent ID <span class="pista">este realtor no tiene Lead ID,
      así que hace falta</span></label><input type="text" id="agent">`;
  $('#volcado').oninput = () => {
    const n = $('#volcado').value.length;
    $('#tam').textContent = n ? n.toLocaleString('es') + ' caracteres' : '';
  };
  /* Un 14 declarado y un 14 por descuido son el mismo número y no valen lo
     mismo. Tocar el campo — aunque se deje en 14 — cuenta como mirarlo. */
  VENTANA_CONFIRMADA = false;
  $('#ventana').oninput = $('#ventana').onfocus = () => {
    VENTANA_CONFIRMADA = true;
    $('#ventanaOrigen').className = 'badge mql';
    $('#ventanaOrigen').innerHTML = '<i>✓</i>confirmada';
  };
  $('#btnGuardar').onclick = guardar;
  cargarBiblio();
}

async function guardar(){
  const volcado = $('#volcado').value;
  if(!volcado.trim()){
    $('#msgs').innerHTML = `<div class="err">La caja está vacía.</div>`;
    return;
  }
  $('#btnGuardar').disabled = true;
  $('#btnGuardar').textContent = 'guardando…';
  try{
    const d = await api('/api/guardar', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        realtor_id: SEL.id, sf_lead_id: SEL.sf_lead_id, estado: SEL.estado,
        mmi_agent_id: ($('#agent') ? $('#agent').value : ''),
        volcado: volcado, forzar: FORZAR,
        ventana_meses: ($('#ventana') ? $('#ventana').value : null),
        ventana_confirmada: VENTANA_CONFIRMADA,
      })
    });
    const avisos = (d.avisos||[]).map(a => `<div class="avi">${esc(a)}</div>`).join('');
    const cond = (d.condados||[]).join(' · ');
    const cont = (d.contactos||[]).map(c =>
      c.canal + ': ' + c.valor + (c.nuevo ? '' : ' (ya estaba)')).join(' · ');
    $('#msgs').innerHTML = `<div class="ok">
      <b><span class="num">${d.bloques}</span> bloques guardados</b> ·
      <span class="num">${d.mercados_promovidos ?? 0}</span> promovidos a la
      biblioteca · ${esc(d.estado || '')} ·
      lote <code>${esc(d.upload_batch_id)}</code>
      ${cond ? '<br>condados: ' + esc(cond) : ''}
      ${cont ? `<br>contactos: <span class="num">${d.contactos_nuevos ?? 0}</span>
        nuevos, <span class="num">${d.contactos_ya_estaban ?? 0}</span> ya estaban
        · ${esc(cont)}` : ''}</div>${avisos}`;
    /* La confirmación va DEBAJO de la caja y no se borra: es lo que se mira
       antes de pasar al realtor siguiente. */
    $('#confirmacion').innerHTML = pintarResumen(d.resumen);
    $('#volcado').value = '';
    $('#tam').textContent = '';
    cargarBiblio();
  }catch(e){
    /* 409 = este volcado ya esta, identico. Se puede guardar igual, pero a
       proposito: cada copia infla el conteo de capturas por mercado. */
    const repetido = e.status === 409;
    $('#msgs').innerHTML = `<div class="err">${esc(e.message)}</div>` +
      (repetido ? `<div style="margin:8px 0">
        <button class="btn sec" id="btnIgual">Guardarlo igual</button></div>` : '');
    if(repetido) $('#btnIgual').onclick = () => { FORZAR = true; guardar() };
  }finally{
    FORZAR = false;
    if($('#btnGuardar')){ $('#btnGuardar').disabled=false; $('#btnGuardar').textContent='Guardar' }
    window.scrollTo({top:0, behavior:'smooth'});
  }
}

async function cargarBiblio(){
  try{
    const d = await api('/api/geografias');
    GEO = d.geografias;
    $('#biblio').innerHTML = GEO.length
      ? `<div class="tbl-scroll"><table class="piv"><thead><tr>
          <th class="lbl">Geografía</th><th>Nivel</th><th>Realtors</th>
          <th class="totcol">Capturas</th></tr></thead><tbody>` +
        GEO.map(g => `<tr class="metric"><td class="lbl">${esc(g.clave)}</td>
          <td><span class="badge sin-evaluar">${esc(g.nivel)}</span></td>
          <td>${g.realtors}</td>
          <td class="totcol">${g.capturas}</td></tr>`).join('') +
        '</tbody></table></div>'
      : '<span class="badge sin-evaluar"><i>▣</i>Todavía no hay ninguna geografía capturada</span>';
  }catch(e){ $('#biblio').innerHTML = `<div class="avi">${esc(e.message)}</div>` }
}

$('#velo').onclick = cerrarPanel;
document.addEventListener('keydown', e => { if(e.key === 'Escape') cerrarPanel() });
let t = null;
$('#q').oninput = () => { clearTimeout(t); t = setTimeout(cargarLista, 280) };
$('#fEstado').onchange = cargarLista;
$('#fMM').onchange = cargarLista;
cargarLista().then(() => $('#estadoGlobal').textContent = '');
</script>
