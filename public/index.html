<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesa de trabajo · Homesí</title>
<!--
  La paleta viene PORTADA de commercial-activity, no escrita aca. Ver la
  cabecera de tokens.css: si hay que actualizarla se vuelve a bajar el archivo.
-->
<!--
  Inter para interfaz y Plus Jakarta Sans para títulos. `tokens.css` declara
  --font-body como `var(--font-inter), …` porque allá los inyecta next/font;
  acá se cargan de Google Fonts y homesi.css define esas dos variables, así que
  el contrato del archivo portado se cumple sin editarlo.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="homesi.css">
<style>
/*
 * Solo el armazon de DOS COLUMNAS, que es propio de esta pantalla. Todo lo
 * demas -- colores, botones, tablas, mensajes-- sale de homesi.css sobre los
 * tokens de marca.
 */
html, body { height: 100% }
.wrap { display: grid; grid-template-columns: 340px 1fr; height: calc(100% - 52px) }
@media (max-width: 860px){ .wrap { grid-template-columns: 1fr } .side { display: none } }
.side { border-right: 1px solid var(--slate-200); display: flex;
  flex-direction: column; min-height: 0; background: var(--white) }
.filtros { padding: 14px; border-bottom: 1px solid var(--slate-200); display: grid; gap: 8px }
.filtros label { margin: 0 }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.cuenta { padding: 9px 14px; font: 600 11px/1.3 var(--font-mono);
  font-variant-numeric: tabular-nums; color: var(--slate-500);
  border-bottom: 1px solid var(--slate-200) }
.listaSide { overflow: auto; flex: 1; min-height: 0 }
.fila { padding: 11px 14px; border-bottom: 1px solid var(--slate-200);
  cursor: pointer; display: flex; gap: 10px; align-items: flex-start }
.fila:hover { background: var(--accent-soft) }
.fila.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--coral) }
.punto { width: 7px; height: 7px; border-radius: var(--radius-full);
  margin-top: 6px; flex: none; background: var(--slate-300) }
.punto.si { background: var(--emerald-700) }
.fila .n { font-weight: 700; font-size: 13px; color: var(--navy) }
.fila .m { color: var(--slate-500); font-size: 11px }
.fila .m b { font-family: var(--font-mono); font-variant-numeric: tabular-nums }
.main { overflow: auto; min-height: 0; padding: 22px 24px 60px }
.main h1 { font: 800 21px/1.2 var(--font-display); color: var(--navy);
  margin: 0 0 3px; letter-spacing: -.02em }
.vacio { color: var(--slate-400); padding: 52px 10px; text-align: center; font-size: 13px }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px }
</style>
</head>
<body>
<header class="hub-header">
  <span class="marca"></span>
  <h1>Mesa de trabajo</h1>
  <span class="sub" id="estadoGlobal">cargando…</span>
  <span class="sub">Homesí · PACS-H</span>
</header>

<div class="wrap">
  <aside class="side">
    <div class="filtros">
      <input type="search" id="q" placeholder="Buscar por nombre, brokerage o email">
      <div class="frow">
        <select id="fEstado"><option value="">Todos los estados</option></select>
        <select id="fMM">
          <option value="">Con y sin Model Match</option>
          <option value="si">Solo con Model Match</option>
          <option value="no">Solo sin Model Match</option>
        </select>
      </div>
    </div>
    <div class="cuenta" id="cuenta"></div>
    <div class="listaSide" id="lista"></div>
  </aside>
  <main class="main" id="detalle">
    <div class="vacio">Elegí un realtor de la lista para abrir su ficha.</div>
  </main>
</div>

<div class="velo" id="velo"></div>
<aside class="panel" id="panel"></aside>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let FILAS = [], SEL = null, TAB = 'mercados', GEO = [], FORZAR = false;

async function api(ruta, opciones){
  const r = await fetch(ruta, opciones);
  const j = await r.json().catch(() => ({error:'respuesta no-JSON'}));
  if(!r.ok){
    const e = new Error(j.error || ('HTTP ' + r.status));
    e.status = r.status; e.datos = j;
    throw e;
  }
  return j;
}

/* ── lista lateral ────────────────────────────────────────────────────── */
async function cargarLista(){
  const p = new URLSearchParams();
  if($('#q').value.trim()) p.set('q', $('#q').value.trim());
  if($('#fEstado').value) p.set('estado', $('#fEstado').value);
  if($('#fMM').value) p.set('mm', $('#fMM').value);
  $('#cuenta').textContent = 'buscando…';
  try{
    const d = await api('/api/realtors?' + p.toString());
    FILAS = d.filas;
    ESTADOS = d.estados || ESTADOS;
    $('#cuenta').textContent = d.truncado
      ? `${d.mostradas} de ${d.total} · afiná la búsqueda para ver el resto`
      : `${d.mostradas} de ${d.total}`;
    pintarLista();
    llenarEstados();
  }catch(e){
    $('#cuenta').textContent = '';
    $('#lista').innerHTML = `<div class="err" style="margin:12px">${esc(e.message)}</div>`;
  }
}

/* El código de dos letras es el valor; el nombre completo es lo que se ve.
   El mapa viene del servidor: escribirlo también acá sería un segundo sitio
   donde puede divergir, que es justo el bug que se acaba de arreglar. */
let ESTADOS = {};
function llenarEstados(){
  const sel = $('#fEstado');
  if(sel.options.length > 1) return;
  const vistos = [...new Set(FILAS.map(f => f.estado).filter(Boolean))]
    .sort((a,b) => (ESTADOS[a]||a).localeCompare(ESTADOS[b]||b));
  vistos.forEach(e => sel.insertAdjacentHTML('beforeend',
    `<option value="${esc(e)}">${esc(ESTADOS[e] || e)}</option>`));
}

function pintarLista(){
  $('#lista').innerHTML = FILAS.map(f => `
    <div class="fila ${SEL && SEL.id===f.id ? 'sel' : ''}" data-id="${f.id}">
      <span class="punto ${f.sf_lead_id ? 'si' : ''}"
            title="${f.sf_lead_id ? 'con Lead ID' : 'sin llave dura'}"></span>
      <span>
        <div class="n">${esc(f.nombre_completo)}</div>
        <div class="m">${esc(f.brokerage || '—')} · ${esc(f.estado || '—')}
          ${f.unidades_ano != null ? ' · ' + f.unidades_ano + ' u/año' : ''}</div>
      </span>
    </div>`).join('') || '<div class="vacio">Nada con esos filtros.</div>';
  document.querySelectorAll('.fila').forEach(el =>
    el.onclick = () => abrir(el.dataset.id));
}

function abrir(id){
  SEL = FILAS.find(f => f.id === id);
  TAB = 'mercados';
  pintarLista();
  pintarFicha();
}

/* ── ficha ────────────────────────────────────────────────────────────── */
/* `Model Match` YA no está deshabilitada: no necesita el motor, sólo lee
   `parseado` de la base y lo muestra. Las otras siguen apagadas porque su
   contenido sí se consume del motor de Python. */
const PESTANAS = [
  ['lectura','Lectura del perfil',false],
  ['calculo','Cómo se calculó',false],
  ['mm','Model Match',true],
  ['mercados','Mercados',true],
  ['ig','Instagram',false],
  ['dossier','Dossier A–G',false],
  ['seq','Secuencia 60 días',false],
];

function pintarFicha(){
  if(!SEL){ $('#detalle').innerHTML = '<div class="vacio">Elegí un realtor.</div>'; return }
  const tabs = PESTANAS.map(([k,t,activa]) =>
    `<button class="tab" role="tab" aria-selected="${TAB===k}" data-tab="${k}"
      ${activa?'':'disabled'}
      title="${activa?'':'todavía no: el contenido se consume del motor de Python'}">${t}</button>`
  ).join('');
  $('#detalle').innerHTML = `
    <h1>${esc(SEL.nombre_completo)}</h1>
    <p class="sub">${esc(SEL.brokerage || '—')} ·
      ${esc(ESTADOS[SEL.estado] || SEL.estado || '—')}
      ${SEL.sf_lead_id ? ' · Lead ' + esc(SEL.sf_lead_id) : ' · <b>sin llave dura</b>'}</p>
    <div class="tabs" role="tablist">${tabs}</div>
    <div id="cuerpo"></div>`;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    TAB = b.dataset.tab; pintarFicha();
  });
  if(TAB === 'mercados') vMercados();
  if(TAB === 'mm') vModelMatch();
}

/* ══ LA CONFIRMACIÓN ═══════════════════════════════════════════════════════
 * Lo mismo se pinta al guardar y al auditar una captura vieja: si se vieran
 * distinto habría que aprender dos pantallas para leer el mismo dato.
 */
const dinero = v => v == null ? '—'
  : v >= 1e9 ? '$' + (v/1e9).toFixed(1) + 'B'
  : v >= 1e6 ? '$' + (v/1e6).toFixed(1) + 'M'
  : '$' + Math.round(v/1e3) + 'K';
const pct = v => v == null ? '—' : v.toFixed(1).replace('.', ',') + '%';

function pintarResumen(r){
  if(!r) return '';
  const secc = r.secciones.map(s => {
    const donde = s.seccion === 'market_signals'
      ? `<span class="badge sin-evaluar"><i>▣</i>${s.nivel === 'estado' ? 'estado' : 'condado'}
         · ${esc(s.etiqueta || '—')}</span>`
      : '';
    return `<li><b>${esc(s.seccion)}</b> ${donde}
      <span class="pista num" style="margin-left:auto">${s.caracteres.toLocaleString('es')} car.</span></li>`;
  }).join('');

  const geo = r.geografias.map(g => `
    <tr class="metric ${g.volumen_repetido ? 'repetido' : ''}">
      <td class="lbl">${esc(g.etiqueta || '(estado)')}</td>
      <td>${esc(g.nivel || '—')}</td>
      <td>${dinero(g.total_volume)}</td>
      <td>${pct(g.mkt_fha)}</td>
      <td>${pct(g.fallout)}</td>
      <td class="totcol">${g.campos == null ? '—' : g.campos}</td>
    </tr>`).join('');

  const repes = (r.volumenes_repetidos || []).length
    ? `<div class="err"><b>Dos geografías con el mismo volumen:</b>
        ${r.volumenes_repetidos.map(n => esc(n.join(' y '))).join('; ')}.
        Eso es el Rolling Monthly Performance, que no respeta el filtro de
        ubicación. Hay que copiar la sección <b>Market Overview</b>.</div>`
    : '';

  const orig = r.originadores.length ? r.originadores.map(o => `
      <li><b>${esc(o.nombre || '—')}</b>
        <span class="pista">${esc(o.empresa || '—')}</span>
        ${o.de_la_casa
          ? '<span class="badge excluido"><i>⛔</i>de la casa</span>' : ''}
        <span class="num" style="margin-left:auto">${o.unidades ?? '—'} u · ${pct(o.share)}</span></li>`).join('')
    : '<li class="pista">sin relaciones de originador en esta captura</li>';

  /* Banner oscuro: la cifra que decide la exclusión, en Soft Sky y mono. */
  const casa = r.share_de_la_casa || {};
  const banner = casa.share != null
    ? `<div class="banner">
         <div class="seccion">Exclusión por no-canibalización · base ${esc(casa.base || '')}</div>
         <span class="cifra ${casa.share > 0 ? '' : 'bien'}">${pct(casa.share)}</span>
         <span class="pista num" style="margin-left:10px">${casa.unidades} de
           ${casa.unidades_totales} unidades del reparto</span>
         ${(casa.originadores||[]).length
           ? '<div class="pista" style="margin-top:6px">' +
             esc(casa.originadores.join(' · ')) + '</div>' : ''}
       </div>`
    : `<div class="banner">
         <div class="seccion">Exclusión por no-canibalización</div>
         <span class="badge bloqueado"><i>▲</i>no se pudo calcular</span>
         <div class="pista" style="margin-top:8px">${esc(casa.razon || '')}</div>
       </div>`;

  const fallos = (r.fallos || []).length
    ? `<div class="tarjeta">
        <div class="seccion">Fallos de lectura</div>
        <p class="sub">Secciones que venían en el texto y quedaron vacías. El
          crudo está guardado: se arregla el parser y se re-deriva sin volver a
          capturar.</p>
        ${r.fallos.map(f => `<div class="avi"><b>${esc(f.seccion)}</b> →
          <code>${esc(f.campo)}</code><br>${esc(f.por_que_importa || '')}</div>`).join('')}</div>`
    : `<div class="tarjeta">
        <div class="seccion">Fallos de lectura</div>
        <span class="badge mql"><i>✓</i>ninguno</span>
        <span class="sub" style="margin-left:8px">Todas las secciones presentes
          en el texto llegaron a un campo.</span></div>`;

  const p = r.perfil || {};
  const guardia = p.cobertura_mix != null && p.cobertura_mix < 50;
  return `
    ${banner}
    ${repes}
    <div class="tarjeta">
      <div class="seccion">Bloques separados</div>
      <h2>${r.secciones.length} secciones, en orden de captura</h2>
      <ul class="lista" style="margin-top:10px">${secc}</ul>
    </div>
    <div class="tarjeta">
      <div class="seccion">Por geografía</div>
      <h2>Volumen, FHA del mercado y fallout</h2>
      <p class="sub" style="margin-bottom:10px">Si dos filas repiten volumen,
        salen en rojo: es la firma del gráfico rodante.</p>
      <div class="tbl-scroll">
        <table class="piv">
          <thead><tr>
            <th class="lbl">Geografía</th><th>Nivel</th><th>Volumen</th>
            <th>FHA</th><th>Fallout</th><th class="totcol">Campos</th>
          </tr></thead>
          <tbody>${geo || '<tr class="metric"><td class="lbl">—</td></tr>'}</tbody>
        </table>
      </div>
    </div>
    <div class="tarjeta">
      <div class="seccion">Originadores · reparto por unidades</div>
      <ul class="lista" style="margin-top:10px">${orig}</ul>
    </div>
    <div class="tarjeta">
      <div class="seccion">Perfil</div>
      <div class="grid2" style="margin-top:12px">
        <div><span class="pista">nombre</span><br>
          <b style="color:var(--navy)">${esc(p.nombre || '—')}</b></div>
        <div><span class="pista">buyer units</span><br>
          <span class="kpi chico">${p.buyer_units ?? '—'}</span></div>
        <div><span class="pista">TPO del agente</span><br>
          <span class="kpi chico">${pct(p.tpo_pct)}</span></div>
        <div><span class="pista">lenders</span><br>
          <span class="kpi chico">${p.lenders ?? 0}</span></div>
        <div><span class="pista">cobertura del mix</span><br>
          <span class="kpi chico">${pct(p.cobertura_mix)}</span>
          ${guardia ? '<br><span class="badge bloqueado"><i>▲</i>no pasa la guardia</span>' : ''}</div>
      </div>
    </div>
    ${fallos}`;
}

/* ── panel lateral · el crudo tal como se pegó ────────────────────────────── */
let CAPTURAS = [];
function abrirPanel(i, j){
  const b = (CAPTURAS[i] || {}).bloques[j];
  if(!b) return;
  $('#panel').innerHTML = `
    <button class="btn sec cerrar" id="cerrarPanel">Cerrar</button>
    <div class="seccion">${esc(b.seccion)}${b.nivel ? ' · ' + esc(b.nivel) : ''}</div>
    <h2>${esc(b.etiqueta || 'sin etiqueta geográfica')}</h2>
    <p class="sub"><span class="num">${b.caracteres.toLocaleString('es')}</span>
      caracteres, tal como se pegaron</p>
    <div class="crudo">${esc(b.texto_crudo)}</div>`;
  $('#cerrarPanel').onclick = cerrarPanel;
  $('#panel').classList.add('abierto');
  $('#velo').classList.add('abierto');
}
function cerrarPanel(){
  $('#panel').classList.remove('abierto');
  $('#velo').classList.remove('abierto');
}

/* ── pestaña Model Match · lo capturado, desde la base ────────────────────── */
async function vModelMatch(){
  $('#cuerpo').innerHTML = '<div class="tarjeta pista">cargando capturas…</div>';
  try{
    const d = await api('/api/capturas?realtor_id=' + encodeURIComponent(SEL.id));
    if(!d.capturas.length){
      $('#cuerpo').innerHTML = `<div class="tarjeta">
        <h2>Model Match</h2>
        <p class="sub" style="margin:0">Este realtor no tiene capturas vigentes.
          Se pegan desde la pestaña <b>Mercados</b>.</p></div>`;
      return;
    }
    CAPTURAS = d.capturas;
    $('#cuerpo').innerHTML = d.capturas.map((c, i) => `
      <div class="tarjeta">
        <div class="seccion">Captura ${d.capturas.length - i} de ${d.capturas.length}</div>
        <h2>${esc((c.capturado_en || '').slice(0,16).replace('T',' '))} ·
          ${esc(c.estado || '—')}</h2>
        <p class="sub" style="margin-bottom:10px">
          <span class="num">${c.caracteres.toLocaleString('es')}</span> caracteres ·
          <code>${esc(c.version_parser || '')}</code></p>
        <div>${(c.bloques||[]).map((b,j) => `
          <button class="btn sec" style="margin:0 6px 6px 0;padding:6px 11px"
            data-cap="${i}" data-blo="${j}">
            ${esc(b.etiqueta || b.seccion)} · <span class="num">${b.caracteres.toLocaleString('es')}</span></button>`).join('')}
        </div>
        <p class="pista" style="margin:6px 0 0">El crudo es lo único que no se
          puede re-derivar de otra cosa: todo lo demás sale de él.</p>
      </div>` + pintarResumen(c.resumen)).join('');
    document.querySelectorAll('[data-cap]').forEach(b => b.onclick = () =>
      abrirPanel(+b.dataset.cap, +b.dataset.blo));
  }catch(e){
    $('#cuerpo').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

/* ── pestaña Mercados · el pegado va acá, dentro de la ficha ──────────── */
function vMercados(){
  $('#cuerpo').innerHTML = `
    <div class="tarjeta">
      <h2>Pegar Model Match</h2>
      <p class="sub" style="margin:0 0 12px">Una sola caja. Recorré el perfil en
        este orden y pegá todo seguido acá:
        <b>1</b> Overview con <i>View Counties</i> ·
        <b>2</b> Market Signals del estado ·
        <b>3</b> Market Signals de cada condado, en el orden del Overview ·
        <b>4</b> Originators con filtro Buyer · <b>5</b> Lenders.<br>
        Los cortes los encuentra el servidor por los títulos de sección; no hay
        que separar nada.</p>
      <div id="msgs"></div>
      <label>Volcado completo
        <span class="pista">Ctrl+A, Ctrl+C en cada pestaña, una debajo de otra</span></label>
      <textarea id="volcado" style="min-height:320px"
        placeholder="Pegá acá el perfil entero, en orden."></textarea>
      <div id="extra"></div>
      <div style="margin-top:12px">
        <button class="btn" id="btnGuardar">Guardar</button>
        <span class="pista" id="tam"></span>
      </div>
    </div>
    <div id="confirmacion"></div>
    <div class="tarjeta">
      <h2>Biblioteca de geografías</h2>
      <div id="biblio" class="pista">cargando…</div>
    </div>`;
  if(!SEL.sf_lead_id) $('#extra').innerHTML =
    `<label>MMI Agent ID <span class="pista">este realtor no tiene Lead ID,
      así que hace falta</span></label><input type="text" id="agent">`;
  $('#volcado').oninput = () => {
    const n = $('#volcado').value.length;
    $('#tam').textContent = n ? n.toLocaleString('es') + ' caracteres' : '';
  };
  $('#btnGuardar').onclick = guardar;
  cargarBiblio();
}

async function guardar(){
  const volcado = $('#volcado').value;
  if(!volcado.trim()){
    $('#msgs').innerHTML = `<div class="err">La caja está vacía.</div>`;
    return;
  }
  $('#btnGuardar').disabled = true;
  $('#btnGuardar').textContent = 'guardando…';
  try{
    const d = await api('/api/guardar', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        realtor_id: SEL.id, sf_lead_id: SEL.sf_lead_id, estado: SEL.estado,
        mmi_agent_id: ($('#agent') ? $('#agent').value : ''),
        volcado: volcado, forzar: FORZAR,
      })
    });
    const avisos = (d.avisos||[]).map(a => `<div class="avi">${esc(a)}</div>`).join('');
    const cond = (d.condados||[]).join(' · ');
    const cont = (d.contactos||[]).map(c => c.canal + ': ' + c.valor).join(' · ');
    $('#msgs').innerHTML = `<div class="ok">
      <b><span class="num">${d.bloques}</span> bloques guardados</b> ·
      <span class="num">${d.mercados_promovidos ?? 0}</span> promovidos a la
      biblioteca · ${esc(d.estado || '')} ·
      lote <code>${esc(d.upload_batch_id)}</code>
      ${cond ? '<br>condados: ' + esc(cond) : ''}
      ${cont ? '<br>contactos: ' + esc(cont) : ''}</div>${avisos}`;
    /* La confirmación va DEBAJO de la caja y no se borra: es lo que se mira
       antes de pasar al realtor siguiente. */
    $('#confirmacion').innerHTML = pintarResumen(d.resumen);
    $('#volcado').value = '';
    $('#tam').textContent = '';
    cargarBiblio();
  }catch(e){
    /* 409 = este volcado ya esta, identico. Se puede guardar igual, pero a
       proposito: cada copia infla el conteo de capturas por mercado. */
    const repetido = e.status === 409;
    $('#msgs').innerHTML = `<div class="err">${esc(e.message)}</div>` +
      (repetido ? `<div style="margin:8px 0">
        <button class="btn sec" id="btnIgual">Guardarlo igual</button></div>` : '');
    if(repetido) $('#btnIgual').onclick = () => { FORZAR = true; guardar() };
  }finally{
    FORZAR = false;
    if($('#btnGuardar')){ $('#btnGuardar').disabled=false; $('#btnGuardar').textContent='Guardar' }
    window.scrollTo({top:0, behavior:'smooth'});
  }
}

async function cargarBiblio(){
  try{
    const d = await api('/api/geografias');
    GEO = d.geografias;
    $('#biblio').innerHTML = GEO.length
      ? `<div class="tbl-scroll"><table class="piv"><thead><tr>
          <th class="lbl">Geografía</th><th>Nivel</th><th>Realtors</th>
          <th class="totcol">Capturas</th></tr></thead><tbody>` +
        GEO.map(g => `<tr class="metric"><td class="lbl">${esc(g.clave)}</td>
          <td><span class="badge sin-evaluar">${esc(g.nivel)}</span></td>
          <td>${g.realtors}</td>
          <td class="totcol">${g.capturas}</td></tr>`).join('') +
        '</tbody></table></div>'
      : '<span class="badge sin-evaluar"><i>▣</i>Todavía no hay ninguna geografía capturada</span>';
  }catch(e){ $('#biblio').innerHTML = `<div class="avi">${esc(e.message)}</div>` }
}

/* ── arranque ─────────────────────────────────────────────────────────── */
$('#velo').onclick = cerrarPanel;
document.addEventListener('keydown', e => { if(e.key === 'Escape') cerrarPanel() });
let t = null;
$('#q').oninput = () => { clearTimeout(t); t = setTimeout(cargarLista, 280) };
$('#fEstado').onchange = cargarLista;
$('#fMM').onchange = cargarLista;
cargarLista().then(() => $('#estadoGlobal').textContent = '');
</script>
</body>
</html>
